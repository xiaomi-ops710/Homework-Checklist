name: ZIPを自動で展開

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-zip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ZIPを展開して、ルートに反映
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ルートにZIPがないので、何もしません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for z in "${zips[@]}"; do
            echo "=== ${z} を展開します"
            # 「../」や絶対パスを含むZIPは危険なので中止
            if unzip -Z1 "$z" | grep -Eq '^/|(^|/)\.\.(/|$)'; then
              echo "::error::${z} に不正なパスが含まれているため中止しました"
              exit 1
            fi
            work="${RUNNER_TEMP}/unzip-work"
            rm -rf "$work" && mkdir -p "$work"
            unzip -q "$z" -d "$work"
            rm -rf "$work/__MACOSX"

            # 1つのフォルダに包まれていたら、その中身を使う
            src="$work"
            mapfile -t top < <(find "$work" -mindepth 1 -maxdepth 1)
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ]; then
              src="${top[0]}"
            fi
            # ワークフローや git の設定は上書きしない
            rm -rf "$src/.github" "$src/.git"

            cp -a "$src/." .
            git rm -q -f -- "$z"
          done

          git add -A
          if git diff --cached --quiet; then
            echo "変更がありませんでした"
            exit 0
          fi
          git commit -m "ZIPを展開して反映: ${zips[*]}"
          git push
