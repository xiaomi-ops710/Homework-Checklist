                    this.shipLight.position.set(shipX, shipY + 2, 6);
                }

                // 3.5 3D空間レーザー照準＆3Dロックオンリングの同期（どの3D視点でも正確にロックオン！）
                let lockedInv = g.getLockedInvader();
                if (this.laserSightMesh) {
                    if (g.laserSightOn && !g.isGameOver) {
                        this.laserSightMesh.visible = true;
                        const startY = shipY + 3.2;
                        const targetY = lockedInv ? this.to3DY(lockedInv.y + lockedInv.h / 2) : 26;
                        const len = Math.max(1, targetY - startY);
                        this.laserSightMesh.position.set(shipX, startY, 1.0);
                        this.laserSightMesh.scale.set(lockedInv ? 1.6 : 0.85, len, lockedInv ? 1.6 : 0.85);
                        this.sightMat.color.setHex(lockedInv ? 0xfde047 : 0x38bdf8);
                        this.sightMat.opacity = lockedInv ? 0.68 : 0.32;
                    } else {
                        this.laserSightMesh.visible = false;
                    }
                }

                if (this.lockReticleGroup) {
                    if (lockedInv && !g.isGameOver) {
                        const bobY = Math.sin(g.tick * 0.075 + lockedInv.hoverOffset) * 3.8;
                        this.lockReticleGroup.visible = true;
                        this.lockReticleGroup.position.set(
                            this.to3DX(lockedInv.x),
                            this.to3DY(lockedInv.y + bobY),
                            1.85
                        );
                        this.lockOuterRing.rotation.z = g.tick * 0.04;
                        this.lockInnerRing.rotation.z = -g.tick * 0.06;
                        const pulse = 1 + Math.sin(g.tick * 0.2) * 0.06;
                        this.lockReticleGroup.scale.set(pulse, pulse, 1);
                    } else {
                        this.lockReticleGroup.visible = false;
                    }
                }

                // 4. 3D元素インベーダーポッド群の同期＆二重電子軌道回転
                const activeSet = new Set(g.invaders);
                for (const [inv, mesh] of this.invaderMeshes.entries()) {
                    if (!activeSet.has(inv)) {
                        this.scene.remove(mesh);
                        this.invaderMeshes.delete(inv);
                    }
                }

                g.invaders.forEach(inv => {
                    let mesh = this.invaderMeshes.get(inv);
                    if (!mesh) {
                        mesh = this.createInvaderMesh(inv);
                        this.invaderMeshes.set(inv, mesh);
                    }

                    const bobY = Math.sin(g.tick * 0.075 + inv.hoverOffset) * 3.8;
                    const wx = this.to3DX(inv.x);
                    const wy = this.to3DY(inv.y + bobY);

                    mesh.position.set(wx, wy, 0);
                    const isAimed = lockedInv === inv;
                    const isHint = g.hintHighlightTimer > 0 && g.targetElement && inv.el.sym === g.targetElement.sym;
                    const sc = Math.max(0.01, inv.scaleAnim * (isAimed ? 1.06 : 1.0));
                    mesh.scale.set(sc, sc, sc);

                    mesh.rotation.y = Math.sin(g.tick * 0.04 + inv.hoverOffset) * 0.16;
                    mesh.rotation.x = isAimed ? 0.14 : Math.cos(g.tick * 0.035 + inv.hoverOffset) * 0.08;

                    if (inv.flashRedTimer > 0) {
                        mesh.userData.edgeMat.color.setHex(0xef4444);
                    } else if (isHint || isAimed) {
                        mesh.userData.edgeMat.color.setHex(0xfde047);
                    } else {
                        mesh.userData.edgeMat.color.setHex(0x38bdf8);
                    }

                    // 2つの電子の3D立体公転アニメーション
                    const eAngle1 = g.tick * 0.075 + inv.hoverOffset;
                    mesh.userData.elecMesh1.position.set(
                        Math.cos(eAngle1) * 6.6,
                        Math.sin(eAngle1) * 6.6 * Math.cos(Math.PI * 0.36),
                        Math.sin(eAngle1) * 6.6 * Math.sin(Math.PI * 0.36)
                    );
                    const eAngle2 = -g.tick * 0.065 + inv.hoverOffset;
                    mesh.userData.elecMesh2.position.set(
                        Math.cos(eAngle2) * 6.6,
                        Math.sin(eAngle2) * 6.6 * Math.cos(-Math.PI * 0.36),
                        Math.sin(eAngle2) * 6.6 * Math.sin(-Math.PI * 0.36)
                    );

                    // ホバージェットの揺らぎ
                    if (mesh.userData.jets) {
                        mesh.userData.jets.forEach((jet, jIdx) => {
                            jet.scale.y = 0.8 + Math.sin(g.tick * 0.45 + jIdx + inv.hoverOffset) * 0.3;
                        });
                    }
                });

                // 5. 3Dプラズマレーザー弾の同期
                while (this.bulletMeshes.length < g.bullets.length) {
                    const bGeo = new THREE.CylinderGeometry(0.35, 0.35, 3.0, 12);
                    const bMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
                    const bMesh = new THREE.Mesh(bGeo, bMat);
                    this.scene.add(bMesh);
                    this.bulletMeshes.push(bMesh);
                }
                for (let i = 0; i < this.bulletMeshes.length; i++) {
                    const bMesh = this.bulletMeshes[i];
                    if (i < g.bullets.length) {
                        const b = g.bullets[i];
                        bMesh.visible = true;
                        bMesh.position.set(this.to3DX(b.x), this.to3DY(b.y), 0.8);
                    } else {
                        bMesh.visible = false;
                    }
                }

                // 6. 3D立体衝撃波リングの更新
                for (let i = this.shockwaveRings.length - 1; i >= 0; i--) {
                    const sr = this.shockwaveRings[i];
                    const u = sr.userData;
                    sr.scale.x += u.scaleSpd;
                    sr.scale.y += u.scaleSpd;
                    sr.rotation.z += 0.08;
                    u.life--;
                    sr.material.opacity = (u.life / u.maxLife) * 0.9;
                    if (u.life <= 0) {
                        this.scene.remove(sr);
                        this.shockwaveRings.splice(i, 1);
                    }
                }

                // 7. 3D爆破ポリゴン破片の更新
                for (let i = this.explosionMeshes.length - 1; i >= 0; i--) {
                    const em = this.explosionMeshes[i];
                    const u = em.userData;
                    em.position.x += u.vx;
                    em.position.y += u.vy;
                    em.position.z += u.vz;
                    em.rotation.x += u.rx;
                    em.rotation.y += u.ry;
                    u.life--;
                    em.material.opacity = u.life / u.maxLife;
                    if (u.life <= 0) {
                        this.scene.remove(em);
                        this.explosionMeshes.splice(i, 1);
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        /**
         * ============================================================================
         * 3. 元素インベーダー メインゲームクラス（13元素完全対応＆3D/2Dハイブリッド）
         * ============================================================================
         */
        class ElementQuizInvaders {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.W = 960;
                this.H = 600;

                // ゲーム設定（デフォルトで3DモードON！）
                this.is3DMode = true;
                this.speedMode = 'normal'; // 'slow', 'normal', 'fast', 'super'
                this.laserSightOn = true;

                // ステータス
                this.score = 0;
                this.timeLeft = 90;
                this.maxTime = 90;
                this.misses = 0;
                this.maxMisses = 5;
                this.highScore = Number(localStorage.getItem('elemQuizInvaders_best') || 5);

                this.combo = 0;
                this.maxCombo = 0;
                this.wave = 1;
                this.cryoCount = 3;
                this.cryoTimer = 0;
                this.hintHighlightTimer = 0;

                this.isPaused = false;
                this.isGameOver = false;
                this.tick = 0;
                this.screenShake = 0;

                // 現在のお題元素（🎯 狙う元素）
                this.targetElement = null;
                this.mistakeHistory = [];

                // プレイヤー宇宙ロケット戦闘機（リアルな3Dメタリック造形＋バンク角＋ジェット噴射）
                this.turret = {
                    x: this.W / 2,
                    y: this.H - 54,
                    w: 78,
                    h: 50,
                    vx: 0,
                    bankAngle: 0,
                    muzzleFlash: 0,
                    speed: 9.0,
                    targetX: null,
                    cooldown: 0,
                    recoil: 0
                };

                // インベーダー隊列（2段千鳥配置・8機編成）
                this.invaders = [];
                this.fleetDir = 1;
                this.bullets = [];
                this.particles = [];
                this.debris = [];         // 撃破時の3D回転金属破片デブリ
                this.lightningArcs = [];  // 正解・誤射時のプラズマ放電アーク
                this.thrusterFlames = [];
                this.shockwaves = [];
                this.popups = [];
                this.meteors = [];        // 宇宙背景を横切る流星

                // 多層パララックス星空（遠景・中景・近景の3レイヤー）
                const starColors = ['#ffffff', '#bae6fd', '#fde68a', '#ddd6fe', '#fecdd3'];
                this.stars = Array.from({ length: 145 }, () => {
                    const layer = Math.random() < 0.5 ? 1 : Math.random() < 0.8 ? 2 : 3;
                    return {
                        x: Math.random() * this.W,
                        y: Math.random() * this.H,
                        r: layer * 0.65 + Math.random() * 0.55,
                        speed: layer * 0.32,
                        alpha: Math.random() * 0.6 + 0.25,
                        twinkleSpeed: Math.random() * 0.06 + 0.015,
                        color: starColors[Math.floor(Math.random() * starColors.length)],
                        layer: layer
                    };
                });

                // 宇宙空間のリアルな星雲（ネビュラ）クラウド
                this.nebulae = [
                    { x: 220, y: 170, r: 280, color: 'rgba(14, 165, 233, 0.11)', vx: 0.08 },
                    { x: 740, y: 250, r: 320, color: 'rgba(99, 102, 241, 0.09)', vx: -0.06 },
                    { x: 480, y: 420, r: 250, color: 'rgba(16, 185, 129, 0.07)', vx: 0.05 }
                ];

                // 背景に浮かぶ3D風分子構造ホログラム
                this.hexHolograms = Array.from({ length: 6 }, (_, i) => ({
                    x: 120 + i * 155,
                    y: 110 + (i % 2) * 240,
                    r: 36 + (i % 3) * 14,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (i % 2 === 0 ? 1 : -1) * 0.004
                }));

                // キー入力状態
                this.keys = {};
                this.holdLeft = false;
                this.holdRight = false;
                this.hasInteracted = false; // 初回タッチ時の誤発射防止フラグ
                this.pointerDownState = null;
                this.lastLockedSym = null;

                // Three.js 3Dレンダラー初期化
                this.threeStage = new ThreeStageRenderer(this);

                this.bindEvents();
                this.renderGuideModal();
                this.restartGame(false);
                this.startTimerInterval();
            }

            /**
             * 現在レーザー照準が合っている最前列のインベーダーを取得
             */
            getLockedInvader() {
                let lockInv = null;
                for (const inv of this.invaders) {
                    if (Math.abs(this.turret.x - inv.x) <= inv.w / 2) {
                        if (!lockInv || inv.y > lockInv.y) lockInv = inv;
                    }
                }
                return lockInv;
            }

            /**
             * 3Dグラフィックモード ON / OFF 切替（フォーカス奪取バグ対策済み）
             */
            toggle3DMode() {
                if (document.activeElement && document.activeElement !== document.body) {
                    document.activeElement.blur();
                }
                this.is3DMode = !this.is3DMode;
                const webglCanvas = document.getElementById('webglCanvas');
                const lbl = document.getElementById('lbl3DMode');
                const btnCam = document.getElementById('btnCamAngle');
                if (this.is3DMode && this.threeStage && this.threeStage.enabled) {
                    webglCanvas.classList.remove('hidden');
                    lbl.textContent = '3Dモード: ON';
                    if (btnCam) btnCam.classList.remove('hidden');
                } else {
                    this.is3DMode = false;
                    webglCanvas.classList.add('hidden');
                    lbl.textContent = '3Dモード: OFF (2D)';
                    if (btnCam) btnCam.classList.add('hidden');
                }
                this.canvas.focus();
            }

            /**
             * 3Dカメラアングルの切替（ダイナミック / コックピット背後 / スタンダード）
             */
            cycleCameraMode() {
                if (document.activeElement && document.activeElement !== document.body) {
                    document.activeElement.blur();
                }
                if (!this.threeStage) return;
                const modes = [
                    { key: 'dynamic',  label: '視点: ダイナミック' },
                    { key: 'cockpit',  label: '視点: コックピット' },
                    { key: 'standard', label: '視点: 正面ワイド' }
                ];
                const idx = modes.findIndex(m => m.key === this.threeStage.camMode);
                const next = modes[(idx + 1) % modes.length];
                this.threeStage.camMode = next.key;
                document.getElementById('lblCamAngle').textContent = next.label;
                this.canvas.focus();
            }

            bindEvents() {
                // Captureフェーズでキー入力を確実にキャッチし、ボタンのフォーカス奪取による誤動作を完全防止！
                window.addEventListener('keydown', (e) => {
                    const code = e.code || '';
                    const key = e.key || '';
                    const isLeft = code === 'ArrowLeft' || code === 'KeyA' || key === 'ArrowLeft' || key === 'a' || key === 'A';
                    const isRight = code === 'ArrowRight' || code === 'KeyD' || key === 'ArrowRight' || key === 'd' || key === 'D';
                    const isFire = code === 'Space' || code === 'Enter' || code === 'ArrowUp' || key === ' ' || key === 'Enter' || key === 'ArrowUp';

                    if (isLeft || isRight || isFire) {
                        e.preventDefault();
                        // ボタンやセレクトにフォーカスが残っていたら即座に解除
                        if (document.activeElement && document.activeElement !== document.body && document.activeElement !== this.canvas) {
                            document.activeElement.blur();
                        }
                    }

                    if (isLeft) this.keys['ArrowLeft'] = true;
                    if (isRight) this.keys['ArrowRight'] = true;
                    this.keys[code] = true;

                    if (isFire) {
                        this.hasInteracted = true;
                        sound.init();
                        this.fireBeam();
                    }
                    if (code === 'KeyH' || key === 'h' || key === 'H') this.useScannerHint();
                    if (code === 'KeyC' || key === 'c' || key === 'C') this.activateCryoFreeze();
                }, { capture: true });

                window.addEventListener('keyup', (e) => {
                    const code = e.code || '';
                    const key = e.key || '';
                    if (code === 'ArrowLeft' || code === 'KeyA' || key === 'ArrowLeft' || key === 'a' || key === 'A') {
                        this.keys['ArrowLeft'] = false;
                    }
                    if (code === 'ArrowRight' || code === 'KeyD' || key === 'ArrowRight' || key === 'd' || key === 'D') {
                        this.keys['ArrowRight'] = false;
                    }
                    this.keys[code] = false;
                }, { capture: true });

                /**
                 * タップ＆マウス操作の改善：
                 * 1. 画面に触れた瞬間 (touchstart / mousedown) は絶対に発射しない（照準移動のみ）。
                 * 2. 初回タッチ（サウンド有効化時）や、指をスライドしてドラッグ移動した際も誤発射しない。
                 * 3. 2回目以降のタッチで、ドラッグせず「元素インベーダーを直接チョンとタップ」した時のみ、その真下へ移動して発射する。
                 */
                const getCanvasCoords = (clientX, clientY) => {
                    const rect = this.canvas.getBoundingClientRect();
                    return {
                        cx: ((clientX - rect.left) / rect.width) * this.W,
                        cy: ((clientY - rect.top) / rect.height) * this.H
                    };
                };

                const onPointerStart = (clientX, clientY) => {
                    if (this.isPaused || this.isGameOver) return;
                    sound.init();
                    const { cx, cy } = getCanvasCoords(clientX, clientY);
                    const wasAlreadyInteracted = this.hasInteracted;
                    this.hasInteracted = true;

                    this.pointerDownState = {
                        startX: cx,
                        startY: cy,
                        isDragging: false,
                        wasAlreadyInteracted: wasAlreadyInteracted,
                        time: performance.now()
                    };

                    // 触れた位置へロケットのX座標を合わせる（発射はしない！）
                    this.turret.x = Math.max(55, Math.min(this.W - 55, cx));
                };

                const onPointerMove = (clientX, clientY) => {
                    if (!this.pointerDownState || this.isPaused || this.isGameOver) return;
                    const { cx, cy } = getCanvasCoords(clientX, clientY);
                    if (Math.hypot(cx - this.pointerDownState.startX, cy - this.pointerDownState.startY) > 10) {
                        this.pointerDownState.isDragging = true;
                    }
                    this.turret.x = Math.max(55, Math.min(this.W - 55, cx));
                };

                const onPointerEnd = (clientX, clientY) => {
                    if (!this.pointerDownState || this.isPaused || this.isGameOver) {
                        this.pointerDownState = null;
                        return;
                    }
                    const st = this.pointerDownState;
                    this.pointerDownState = null;

                    // 初回タッチ時やドラッグ移動時は発射しない！
                    if (!st.wasAlreadyInteracted || st.isDragging) return;

                    const { cx, cy } = getCanvasCoords(clientX, clientY);
                    const tapDuration = performance.now() - st.time;
                    if (tapDuration > 380) return;

                    // インベーダーを直接タップしていた場合のみ、そのインベーダーの位置へ合わせてショット発射！
                    let tappedInv = null;
                    for (const inv of this.invaders) {
                        if (Math.abs(cx - inv.x) <= inv.w / 2 + 16 && Math.abs(cy - inv.y) <= inv.h / 2 + 16) {
                            tappedInv = inv;
                            break;
                        }
                    }

                    if (tappedInv) {
                        this.turret.x = Math.max(55, Math.min(this.W - 55, tappedInv.x));
                        this.fireBeam();
                    }
                };

                this.canvas.addEventListener('mousedown', (e) => {
                    onPointerStart(e.clientX, e.clientY);
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    if (e.buttons === 1) {
                        onPointerMove(e.clientX, e.clientY);
                    }
                });

                this.canvas.addEventListener('mouseup', (e) => {
                    onPointerEnd(e.clientX, e.clientY);
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (this.isPaused || this.isGameOver) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    onPointerStart(t.clientX, t.clientY);
                }, { passive: false });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (this.isPaused || this.isGameOver) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    onPointerMove(t.clientX, t.clientY);
                }, { passive: false });

                this.canvas.addEventListener('touchend', (e) => {
                    if (this.isPaused || this.isGameOver) return;
                    e.preventDefault();
                    const t = e.changedTouches[0];
                    if (t) onPointerEnd(t.clientX, t.clientY);
                }, { passive: false });

                // 下部ボタンイベント
                const bindHold = (id, prop) => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    const on = (e) => { e.preventDefault(); this.hasInteracted = true; sound.init(); this[prop] = true; };
                    const off = (e) => { e.preventDefault(); this[prop] = false; };
                    btn.addEventListener('mousedown', on);
                    btn.addEventListener('mouseup', off);
                    btn.addEventListener('mouseleave', off);
                    btn.addEventListener('touchstart', on, { passive: false });
                    btn.addEventListener('touchend', off, { passive: false });
                };
                bindHold('btnLeft', 'holdLeft');
                bindHold('btnRight', 'holdRight');

                const fireBtn = document.getElementById('btnFire');
                if (fireBtn) {
                    const triggerFire = (e) => {
                        e.preventDefault();
                        this.hasInteracted = true;
                        sound.init();
                        this.fireBeam();
                    };
                    fireBtn.addEventListener('mousedown', triggerFire);
                    fireBtn.addEventListener('touchstart', triggerFire, { passive: false });
                }
            }

            /**
             * 1秒ごとの残り時間カウントダウンタイマー
             */
            startTimerInterval() {
                setInterval(() => {
                    if (this.isPaused || this.isGameOver) return;
                    if (this.cryoTimer > 0) return; // 凍結中はタイマー停止
                    this.timeLeft = Math.max(0, this.timeLeft - 1);
                    this.updateHud();
                    if (this.timeLeft <= 0) {
                        this.endGame('TIME UP!', '制限時間 90秒 が経過しました！');
                    }
                }, 1000);
            }

            /**
             * 速さ変更・一時停止・ヒント・時間凍結・リスタート制御
             */
            changeSpeed(val) {
                this.speedMode = val;
            }

            togglePause() {
                if (this.isGameOver) return;
                this.isPaused = !this.isPaused;
                document.getElementById('lblPause').textContent = this.isPaused ? '再開' : '一時停止';
                document.getElementById('iconPause').className = `fa-solid ${this.isPaused ? 'fa-play' : 'fa-pause'} text-xs`;
            }

            useScannerHint() {
                if (this.isPaused || this.isGameOver || !this.targetElement) return;
                sound.init();
                this.hintHighlightTimer = 160;
                this.addPopup(
                    this.W / 2,
                    this.H / 2 - 40,
                    `💡 ヒント：${this.targetElement.name} の元素記号は「${this.targetElement.sym}」！`,
                    '#fde047',
                    18
                );
            }

            activateCryoFreeze() {
                if (this.isPaused || this.isGameOver || this.cryoCount <= 0 || this.cryoTimer > 0) return;
                sound.init();
                this.cryoCount--;
                this.cryoTimer = 300; // 5秒間凍結
                document.getElementById('lblCryoCount').textContent = this.cryoCount;
                this.addPopup(this.W / 2, this.H / 2, '❄️ 時間凍結！ 5秒間インベーダー減速＆タイマー停止！', '#38bdf8', 18);
            }

            restartGame(playAudio = true) {
                this.score = 0;
                this.hits = 0;
                this.timeLeft = this.maxTime;
                this.misses = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.wave = 1;
                this.cryoCount = 3;
                this.cryoTimer = 0;
                this.hintHighlightTimer = 0;
                this.isPaused = false;
                this.isGameOver = false;
                this.mistakeHistory = [];
                this.bullets = [];
                this.particles = [];
                this.debris = [];
                this.lightningArcs = [];
                this.shockwaves = [];
                this.popups = [];

                document.getElementById('lblCryoCount').textContent = this.cryoCount;
                document.getElementById('lblPause').textContent = '一時停止';
                document.getElementById('iconPause').className = 'fa-solid fa-pause text-xs';
                document.getElementById('overlayResult').classList.add('hidden');

                this.spawnWaveFleet();
                this.chooseNextTarget(false);
                this.updateHud();

                if (playAudio) {
                    sound.init();
                    if (sound.bgmOn) sound.startBgm();
                }
            }

            /**
             * 13種類の元素から8機を選び、オリジナルと同じ2段千鳥配置（上段4機・下段4機）で編成
             */
            spawnWaveFleet() {
                this.invaders = [];
                const shuffled = [...ELEMENTS_LIST].sort(() => Math.random() - 0.5).slice(0, 8);

                const topY = 165;
                const botY = 250;
                const spacingX = 165;

                for (let i = 0; i < 8; i++) {
                    const row = i < 4 ? 0 : 1;
                    const col = i % 4;
                    const xOffset = row === 0 ? -38 : 38;
                    const startX = (this.W / 2) - (1.5 * spacingX) + col * spacingX + xOffset;

                    this.invaders.push({
                        el: shuffled[i],
                        x: startX,
                        y: row === 0 ? topY : botY,
                        w: 112,
                        h: 64,
                        scaleAnim: 0.1,
                        flashRedTimer: 0,
                        hoverOffset: i * 0.85
                    });
                }
            }

            /**
             * 画面内のインベーダーから次の「🎯 狙う元素」を選出（全滅時は次WAVE補充）
             */
            chooseNextTarget(fromHit = false) {
                if (this.invaders.length === 0) {
                    this.wave++;
                    this.timeLeft = Math.min(99, this.timeLeft + 5);
                    sound.playWaveClear();
                    this.addPopup(this.W / 2, this.H / 2 - 20, `🎉 WAVE ${this.wave - 1} CLEAR! 残り時間+5秒！`, '#fde047', 22);
                    this.spawnWaveFleet();
                }

                const nextInv = this.invaders[Math.floor(Math.random() * this.invaders.length)];
                this.targetElement = nextInv.el;

                const nameEl = document.getElementById('uiTargetName');
                const hintEl = document.getElementById('uiTargetHint');
                const bannerEl = document.getElementById('targetBanner');

                if (nameEl) nameEl.textContent = this.targetElement.name;
                if (hintEl) hintEl.textContent = `原子番号${this.targetElement.z} / ${this.targetElement.hint}`;

                if (bannerEl) {
                    bannerEl.classList.remove('pop-anim');
                    void bannerEl.offsetWidth;
                    bannerEl.classList.add('pop-anim');
                    setTimeout(() => bannerEl.classList.remove('pop-anim'), 220);
                }

                if (fromHit && this.hasInteracted) {
                    sound.speakJa(this.targetElement.name);
                }
            }

            /**
             * 砲台からプラズマ弾を発射（自機のX座標に応じた3Dステレオ定位サウンド付き）
             */
            fireBeam() {
                if (this.isPaused || this.isGameOver) return;
                if (this.turret.cooldown > 0) return;

                // 画面内に同時に撃てる弾は2発まで（誤射を防ぎ狙い撃ちしやすくする）
                if (this.bullets.length >= 2) return;

                this.turret.cooldown = 10;
                this.turret.recoil = 8;
                this.turret.muzzleFlash = 6;
                const panVal = (this.turret.x / this.W) * 1.6 - 0.8;
                sound.playShot(panVal);

                this.bullets.push({
                    x: this.turret.x,
                    y: this.turret.y - 34,
                    vy: -16.5,
                    r: 6,
                    trail: []
                });
            }

            /**
             * インベーダーに弾が当たった時の正誤判定（ここがこのゲームの核心！）
             */
            onHitInvader(inv, bullet) {
                const isCorrect = this.targetElement && inv.el.sym === this.targetElement.sym;
                const hitPan = (inv.x / this.W) * 1.6 - 0.8;

                if (isCorrect) {
                    // ⭕ 正解！！
                    this.combo++;
                    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                    this.hits = (this.hits || 0) + 1;

                    const gain = 1;
                    this.score += gain;
                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        localStorage.setItem('elemQuizInvaders_best', String(this.highScore));
                    }

                    // 3連続正解ごとに残り時間+2秒ボーナス！
                    if (this.combo > 0 && this.combo % 3 === 0) {
                        this.timeLeft = Math.min(99, this.timeLeft + 2);
                        this.addPopup(inv.x, inv.y - 45, `🔥 ${this.combo}連続正解！ 残り時間+2秒！`, '#38bdf8', 16);
                    }

                    sound.playCorrect(this.combo, hitPan);
                    // 元素固有のリアルな炎色反応スパーク＆3D金属破片デブリ＆プラズマ放電＆二段衝撃波リング
                    this.spawnExplosion(inv.x, inv.y, inv.el.flame, 56);
                    this.spawnMetalDebris(inv.x, inv.y, inv.el.flame, 14);
                    if (this.threeStage) {
                        this.threeStage.spawn3DBurst(inv.x, inv.y, inv.el.flame, 24);
                    }
                    this.spawnLightningArc(this.turret.x, this.turret.y - 38, inv.x, inv.y, inv.el.flame);

                    this.shockwaves.push({
                        x: inv.x,
                        y: inv.y,
                        r: 10,
                        maxR: 120,
                        color: inv.el.flame,
                        alpha: 1.0,
                        lineWidth: 4.5
                    });
                    this.shockwaves.push({
                        x: inv.x,
                        y: inv.y,
                        r: 4,
                        maxR: 74,
                        color: '#ffffff',
                        alpha: 0.9,
                        lineWidth: 2.2
                    });

                    this.addPopup(
                        inv.x,
                        inv.y - 12,
                        `⭕ 正解！ ${inv.el.sym} ＝ ${inv.el.name}`,
                        '#4ade80',
                        19
                    );

                    // 撃破したインベーダーをリストから削除し、次のお題を選出
                    const idx = this.invaders.indexOf(inv);
                    if (idx !== -1) this.invaders.splice(idx, 1);

                    this.updateHud();
                    this.chooseNextTarget(true);

                } else {
                    // ❌ 不正解（違う元素記号を撃ってしまった！）
                    this.misses++;
                    this.combo = 0;
                    inv.flashRedTimer = 38;
                    this.screenShake = 14;

                    // 間違えた元素を復習リストに記録
                    if (this.targetElement && !this.mistakeHistory.some(m => m.sym === this.targetElement.sym)) {
                        this.mistakeHistory.push(this.targetElement);
                    }

                    sound.playWrong(hitPan);
                    this.spawnExplosion(bullet.x, bullet.y, '#ef4444', 28);
                    if (this.threeStage) {
                        this.threeStage.spawn3DBurst(bullet.x, bullet.y, '#ef4444', 12);
                    }
                    this.spawnLightningArc(inv.x - 45, inv.y, inv.x + 45, inv.y, '#ef4444');
                    this.shockwaves.push({
                        x: inv.x,
                        y: inv.y,
                        r: 25,
                        maxR: 82,
                        color: '#ef4444',
                        alpha: 0.95,
                        lineWidth: 3.5
                    });

                    // 撃ってしまった元素が何だったのかをその場で教えてくれる学習ポップアップ！
                    this.addPopup(
                        inv.x,
                        inv.y - 16,
                        `❌ ミス！ ${inv.el.sym} は「${inv.el.name}」です`,
                        '#f87171',
                        17
                    );

                    // ミスカードの赤シェイク演出
                    const missCard = document.getElementById('cardMiss');
                    const wrapper = document.getElementById('canvasWrapper');
                    [missCard, wrapper].forEach(el => {
                        if (!el) return;
                        el.classList.remove('animate-miss');
                        void el.offsetWidth;
                        el.classList.add('animate-miss');
                    });

                    this.updateHud();

                    // ミスが 5 / 5 に達したらゲームオーバー
                    if (this.misses >= this.maxMisses) {
                        this.endGame('GAME OVER', 'ミスが 5回 に達しました！');
                    }
                }
            }

            spawnExplosion(x, y, color, count = 36) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 7.5 + 1.2;
                    const isSmoke = i % 5 === 0;
                    this.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        r: isSmoke ? Math.random() * 9 + 5 : Math.random() * 4.4 + 1.5,
                        color: isSmoke ? 'rgba(148, 163, 184, 0.35)' : (Math.random() < 0.35 ? '#ffffff' : color),
                        isSmoke: isSmoke,
                        life: Math.floor(Math.random() * 28 + 18),
                        maxLife: 46
                    });
                }
            }

            // 撃破時に飛び散るリアルな3D回転メタリック装甲破片
            spawnMetalDebris(x, y, glowColor, count = 10) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 6.2 + 2.0;
                    this.debris.push({
                        x,
                        y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 1.2,
                        w: Math.random() * 9 + 5,
                        h: Math.random() * 5 + 3,
                        rot: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.28,
                        color: Math.random() < 0.5 ? '#38bdf8' : glowColor,
                        life: 36,
                        maxLife: 36
                    });
                }
            }

            // プラズマ稲妻アーク放電エフェクト生成
            spawnLightningArc(x1, y1, x2, y2, color) {
                const pts = [{ x: x1, y: y1 }];
                const steps = 6;
                for (let i = 1; i < steps; i++) {
                    const t = i / steps;
                    pts.push({
                        x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * 32,
                        y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * 24
                    });
                }
                pts.push({ x: x2, y: y2 });
                this.lightningArcs.push({ pts, color, life: 10, maxLife: 10 });
            }

            addPopup(x, y, text, color = '#ffffff', size = 16) {
                this.popups.push({
                    x: Math.max(130, Math.min(this.W - 130, x)),
                    y,
                    text,
                    color,
                    size,
                    life: 52,
                    maxLife: 52
                });
            }

            updateHud() {
                document.getElementById('uiScore').textContent = this.score;
                document.getElementById('uiTime').textContent = this.timeLeft;
                document.getElementById('uiMiss').textContent = `${this.misses} / ${this.maxMisses}`;
                document.getElementById('uiHighScore').textContent = this.highScore;

                // 残り時間バー更新
                const bar = document.getElementById('uiTimeBar');
                if (bar) {
                    const pct = Math.max(0, (this.timeLeft / this.maxTime) * 100);
                    bar.style.width = `${pct}%`;
                    bar.className = `h-full transition-all duration-300 ${this.timeLeft <= 15 ? 'bg-rose-500' : this.timeLeft <= 35 ? 'bg-amber-400' : 'bg-sky-400'}`;
                }

                // コンボバッジ更新
                const comboBadge = document.getElementById('uiComboBadge');
                if (comboBadge) {
                    if (this.combo >= 2) {
                        comboBadge.textContent = `🔥${this.combo}連続!`;
                        comboBadge.classList.remove('hidden');
                    } else {
                        comboBadge.classList.add('hidden');
                    }
                }
            }

            endGame(badgeText, reasonText) {
                this.isGameOver = true;
                sound.stopBgm();

                // アプリ（課題マネージャー）へ結果を送る：実績・挑戦回数に使われる
                try {
                    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'kosa-invader', score: this.score, hits: this.hits || 0, maxCombo: this.maxCombo }, '*');
                } catch (e) { }
                this.hits = 0;
                document.getElementById('resultBadge').textContent = badgeText;
                document.getElementById('resultSub').textContent = reasonText;
                document.getElementById('resFinalScore').textContent = this.score;
                document.getElementById('resMaxCombo').textContent = `${this.maxCombo} 連続`;
                document.getElementById('resBestScore').textContent = this.highScore;

                // 復習リストの作成
                const reviewList = document.getElementById('reviewList');
                const itemsToReview = this.mistakeHistory.length > 0
                    ? this.mistakeHistory
                    : this.invaders.map(i => i.el).slice(0, 6);

                reviewList.innerHTML = itemsToReview.map(el => `
                    <div class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600 flex items-center gap-2">
                        <span class="font-cyber font-black text-base text-sky-300">${el.sym}</span>
                        <span class="font-bold text-white">${el.name}</span>
                        <span class="text-[11px] text-slate-400">(${el.hint})</span>
                    </div>
                `).join('');

                document.getElementById('overlayResult').classList.remove('hidden');
            }

            /**
             * ============================================================================
             * 4. メインフレーム更新処理 (update)
             * ============================================================================
             */
            update() {
                this.tick++;
                if (this.isPaused || this.isGameOver) return;

                if (this.screenShake > 0) this.screenShake *= 0.84;
                if (this.cryoTimer > 0) this.cryoTimer--;
                if (this.hintHighlightTimer > 0) this.hintHighlightTimer--;

                // 0. 背景の多層パララックス星空・星雲・分子ホログラムの更新
                this.stars.forEach(s => {
                    s.y += s.speed * (this.cryoTimer > 0 ? 0.2 : 1.0);
                    if (s.y > this.H) {
                        s.y = -4;
                        s.x = Math.random() * this.W;
                    }
                });
                this.nebulae.forEach(nb => {
                    nb.x += nb.vx;
                    if (nb.x < 100 || nb.x > this.W - 100) nb.vx *= -1;
                });
                this.hexHolograms.forEach(hx => {
                    hx.angle += hx.rotSpeed;
                });

                // ランダムな流星の生成と更新
                if (Math.random() < 0.015) {
                    this.meteors.push({
                        x: Math.random() * this.W,
                        y: -20,
                        vx: -3.5 - Math.random() * 2.5,
                        vy: 5.5 + Math.random() * 3.5,
                        len: 45 + Math.random() * 35,
                        life: 40
                    });
                }
                for (let i = this.meteors.length - 1; i >= 0; i--) {
                    const m = this.meteors[i];
                    m.x += m.vx;
                    m.y += m.vy;
                    m.life--;
                    if (m.life <= 0 || m.y > this.H) this.meteors.splice(i, 1);
                }

                // 1. ロケット（自機）の左右移動＆バンク角（機体の傾き）＆ジェット噴射パーティクル
                const t = this.turret;
                const prevX = t.x;
                if (t.cooldown > 0) t.cooldown--;
                if (t.recoil > 0) t.recoil *= 0.76;
                if (t.muzzleFlash > 0) t.muzzleFlash--;

                let moveDir = 0;
                if (this.keys['ArrowLeft'] || this.keys['KeyA'] || this.holdLeft) {
                    t.x -= t.speed;
                    moveDir = -1;
                }
                if (this.keys['ArrowRight'] || this.keys['KeyD'] || this.holdRight) {
                    t.x += t.speed;
                    moveDir = 1;
                }
                t.x = Math.max(55, Math.min(this.W - 55, t.x));
                t.vx = t.x - prevX;

                // 移動方向に応じたリアルな機体ロール角補間
                const targetBank = moveDir !== 0 ? moveDir * 0.22 : Math.max(-0.22, Math.min(0.22, t.vx * 0.025));
                t.bankAngle += (targetBank - t.bankAngle) * 0.22;

                // 照準が新しいインベーダーを捉えた瞬間に心地よいSFロックオン音を鳴らす
                const curLock = this.getLockedInvader();
                const curLockSym = curLock ? curLock.el.sym : null;
                if (curLockSym && curLockSym !== this.lastLockedSym && this.hasInteracted) {
                    const lockPan = (curLock.x / this.W) * 1.6 - 0.8;
                    sound.playLockOn(lockPan);
                }
                this.lastLockedSym = curLockSym;

                // ロケット下部のツイン・スラスターから噴射炎パーティクルを生成
                for (let side of [-14, 14]) {
                    this.thrusterFlames.push({
                        x: t.x + side + (Math.random() - 0.5) * 3,
                        y: t.y + 22 + t.recoil,
                        vx: (Math.random() - 0.5) * 0.9 - t.vx * 0.08,
                        vy: Math.random() * 2.8 + 2.2,
                        r: Math.random() * 3.5 + 2.2,
                        life: 14,
                        maxLife: 14,
                        color: Math.random() < 0.45 ? '#38bdf8' : Math.random() < 0.8 ? '#f59e0b' : '#ffffff'
                    });
                }
                for (let i = this.thrusterFlames.length - 1; i >= 0; i--) {
                    const fl = this.thrusterFlames[i];
                    fl.x += fl.vx;
                    fl.y += fl.vy;
                    fl.r *= 0.92;
                    fl.life--;
                    if (fl.life <= 0) this.thrusterFlames.splice(i, 1);
                }

                // 2. インベーダー隊列の左右移動＆端での折り返し降下（狙いやすいよう全体的に移動速度をマイルドに調整！）
                const speedMap = { slow: 0.42, normal: 0.78, fast: 1.35, super: 2.15 };
                const baseSpd = speedMap[this.speedMode] || 0.78;
                const cryoMult = this.cryoTimer > 0 ? 0.08 : 1.0;
                const vx = this.fleetDir * baseSpd * cryoMult;

                let hitEdge = false;
                this.invaders.forEach(inv => {
                    inv.x += vx;
                    if (inv.scaleAnim < 1) inv.scaleAnim = Math.min(1, inv.scaleAnim + 0.08);
                    if (inv.flashRedTimer > 0) inv.flashRedTimer--;

                    if (inv.x + inv.w / 2 >= this.W - 28 && this.fleetDir > 0) hitEdge = true;
                    if (inv.x - inv.w / 2 <= 28 && this.fleetDir < 0) hitEdge = true;
                });

                if (hitEdge) {
                    this.fleetDir *= -1;
                    this.invaders.forEach(inv => {
                        inv.y += 12;
                        if (inv.y + inv.h / 2 >= this.turret.y - 34) {
                            inv.y -= 220;
                        }
                    });
                }

                // 3. プラズマビーム弾の移動＆残光トレイル記録＆インベーダーとの当たり判定
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.trail.push({ x: b.x, y: b.y });
                    if (b.trail.length > 7) b.trail.shift();
                    b.y += b.vy;

                    if (b.y < -20) {
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    let hit = false;
                    for (let j = 0; j < this.invaders.length; j++) {
                        const inv = this.invaders[j];
                        if (
                            Math.abs(b.x - inv.x) <= inv.w / 2 + b.r - 2 &&
                            Math.abs(b.y - inv.y) <= inv.h / 2 + b.r - 2
                        ) {
                            this.onHitInvader(inv, b);
                            hit = true;
                            break;
                        }
                    }
                    if (hit) {
                        this.bullets.splice(i, 1);
                    }
                }

                // 4. パーティクル・ショックウェーブ・ポップアップ更新
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const pt = this.particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.vx *= 0.96;
                    pt.vy *= 0.96;
                    pt.life--;
                    if (pt.life <= 0) this.particles.splice(i, 1);
                }
                for (let i = this.debris.length - 1; i >= 0; i--) {
                    const db = this.debris[i];
                    db.x += db.vx;
                    db.y += db.vy;
                    db.vy += 0.14; // 微小重力
                    db.rot += db.vRot;
                    db.life--;
                    if (db.life <= 0) this.debris.splice(i, 1);
                }
                for (let i = this.lightningArcs.length - 1; i >= 0; i--) {
                    this.lightningArcs[i].life--;
                    if (this.lightningArcs[i].life <= 0) this.lightningArcs.splice(i, 1);
                }
                for (let i = this.shockwaves.length - 1; i >= 0; i--) {
                    const sw = this.shockwaves[i];
                    sw.r += (sw.maxR - sw.r) * 0.18;
                    sw.alpha -= 0.04;
                    if (sw.alpha <= 0) this.shockwaves.splice(i, 1);
                }
                for (let i = this.popups.length - 1; i >= 0; i--) {
                    const pp = this.popups[i];
                    pp.y -= 0.85;
                    pp.life--;
                    if (pp.life <= 0) this.popups.splice(i, 1);
                }
            }

            /**
             * ============================================================================
             * 5. キャンバス描画処理 (超リアルな宇宙背景・3Dインベーダー・本格ロケット戦闘機)
             * ============================================================================
             */
            draw() {
                const ctx = this.ctx;
                const use3D = this.is3DMode && this.threeStage && this.threeStage.enabled;

                // 3Dモード有効時はThree.jsのWebGLシーンをレンダリングし、2Dキャンバスは透過オーバーレイ（照準・スペクトラム・ポップアップ・衝撃波）として機能させる
                if (use3D) {
                    this.threeStage.render();
                    ctx.clearRect(0, 0, this.W, this.H);
                }

                ctx.save();

                if (this.screenShake > 0.5) {
                    ctx.translate(
                        (Math.random() - 0.5) * this.screenShake,
                        (Math.random() - 0.5) * this.screenShake
                    );
                }

                if (!use3D) {
                    // 1. ディープスペース宇宙背景グラデーション (2Dモード時)
                    const bgGrad = ctx.createRadialGradient(this.W / 2, this.H * 0.28, 40, this.W / 2, this.H * 0.5, this.W * 0.75);
                    bgGrad.addColorStop(0, '#0c1e3b');
                    bgGrad.addColorStop(0.55, '#050d1d');
                    bgGrad.addColorStop(1, '#02050c');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, this.W, this.H);

                    // 1.2 リアルな星雲（ネビュラ）ガス雲のブレンド描画
                    this.nebulae.forEach(nb => {
                        const nGrad = ctx.createRadialGradient(nb.x, nb.y, 10, nb.x, nb.y, nb.r);
                        nGrad.addColorStop(0, nb.color);
                        nGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = nGrad;
                        ctx.beginPath();
                        ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    // 1.25 遠景の巨大環付き惑星（土星風リングプラネット）と大気グロー
                    ctx.save();
                    const px = 835, py = 105, pr = 44;
                    const atmoGrad = ctx.createRadialGradient(px, py, pr * 0.8, px, py, pr * 1.55);
                    atmoGrad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
                    atmoGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    ctx.fillStyle = atmoGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, pr * 1.55, 0, Math.PI * 2);
                    ctx.fill();

                    const plGrad = ctx.createRadialGradient(px - 16, py - 16, 6, px, py, pr);
                    plGrad.addColorStop(0, '#38bdf8');
                    plGrad.addColorStop(0.55, '#1e3a8a');
                    plGrad.addColorStop(1, '#020617');
                    ctx.fillStyle = plGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, pr, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(125, 211, 252, 0.28)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.ellipse(px, py, pr * 1.95, pr * 0.42, -0.32, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 流星の描画
                this.meteors.forEach(m => {
                    ctx.save();
                    const mGrad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 6, m.y - m.vy * 6);
                    mGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
                    mGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    ctx.strokeStyle = mGrad;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6);
                    ctx.stroke();
                    ctx.restore();
                });

                // 時間凍結中の氷クリスタルフィールド演出
                if (this.cryoTimer > 0) {
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.11)';
                    ctx.fillRect(0, 0, this.W, this.H);
                }

                if (!use3D) {
                    // 2. 多層パララックス恒星（2Dモード時）
                    this.stars.forEach(s => {
                        const tw = s.alpha + Math.sin(this.tick * s.twinkleSpeed) * 0.25;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0.1, Math.min(1, tw));
                        ctx.fillStyle = s.color;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();

                        if (s.layer === 3 && tw > 0.65) {
                            ctx.strokeStyle = s.color;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.moveTo(s.x - 4.5, s.y);
                            ctx.lineTo(s.x + 4.5, s.y);
                            ctx.moveTo(s.x, s.y - 4.5);
                            ctx.lineTo(s.x, s.y + 4.5);
                            ctx.stroke();
                        }
                        ctx.restore();
                    });

                    // 3. 下部のサイバー防衛グリッド＆レールライン (2Dモード時)
                    ctx.save();
                    const horizonY = this.H - 42;
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 8;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, horizonY);
                    ctx.lineTo(this.W, horizonY);
                    ctx.stroke();

                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
                    ctx.lineWidth = 1;
                    for (let i = -6; i <= 6; i++) {
                        ctx.beginPath();
                        ctx.moveTo(this.W / 2 + i * 75, horizonY);
                        ctx.lineTo(this.W / 2 + i * 135, this.H);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // 3.5 BGM立体音響リアルタイム・スペクトラム波形ビジュアライザー
                const spec = sound.getSpectrum();
                if (spec) {
                    ctx.save();
                    const barCount = 24;
                    const barW = this.W / barCount;
                    for (let i = 0; i < barCount; i++) {
                        const val = spec[i] || 0;
                        const barH = (val / 255) * 46;
                        ctx.fillStyle = `rgba(56, 189, 248, ${0.08 + (val / 255) * 0.18})`;
                        ctx.fillRect(i * barW + 2, this.H - barH, barW - 4, barH);
                    }
                    ctx.restore();
                }

                // 4. 照準ガイドレーザー（ロックオン時はゴールドシアンに輝き、ターゲットサークル＆元素記号ロックオン表示）
                if (this.laserSightOn && !this.isGameOver) {
                    const lockInv = this.getLockedInvader();

                    ctx.save();
                    const endY = lockInv ? lockInv.y + lockInv.h / 2 : 36;
                    const laserGrad = ctx.createLinearGradient(0, this.turret.y - 34, 0, endY);
                    laserGrad.addColorStop(0, 'rgba(56, 189, 248, 0.55)');
                    laserGrad.addColorStop(1, lockInv ? 'rgba(250, 204, 21, 0.78)' : 'rgba(56, 189, 248, 0.08)');
                    ctx.strokeStyle = laserGrad;
                    ctx.lineWidth = lockInv ? 2.6 : 1.8;
                    ctx.setLineDash([7, 6]);
                    ctx.lineDashOffset = -this.tick * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(this.turret.x, this.turret.y - 34);
                    ctx.lineTo(this.turret.x, endY);
                    ctx.stroke();

                    if (lockInv) {
                        ctx.setLineDash([]);
                        ctx.strokeStyle = '#fde047';
                        ctx.lineWidth = 2.2;
                        ctx.beginPath();
                        ctx.arc(this.turret.x, endY, 8, 0, Math.PI * 2);
                        ctx.stroke();

                        // 照準中の元素記号をロックオンバッジ表示（誤射防止＆サイバー演出）
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        ctx.strokeStyle = '#fde047';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(this.turret.x - 36, endY + 12, 72, 22, 6);
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = '#fef08a';
                        ctx.font = '800 12px "Orbitron", "Noto Sans JP", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`LOCK: ${lockInv.el.sym}`, this.turret.x, endY + 23);
                    }
                    ctx.restore();
                }

                // 5. ショックウェーブ描画
                this.shockwaves.forEach(sw => {
                    ctx.save();
                    ctx.strokeStyle = sw.color;
                    ctx.shadowColor = sw.color;
                    ctx.shadowBlur = 14;
                    ctx.globalAlpha = Math.max(0, sw.alpha);
                    ctx.lineWidth = sw.lineWidth || 3.5;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });

                if (!use3D) {
                    // 6. 元素インベーダーポッド描画（2Dモード時）
                    this.invaders.forEach(inv => {
                        this.drawInvaderPod(ctx, inv);
                    });

                    // 7. プラズマビーム弾＆残光トレイルの描画（2Dモード時）
                    this.bullets.forEach(b => {
                        ctx.save();
                        for (let i = 0; i < b.trail.length; i++) {
                            const tr = b.trail[i];
                            const ratio = (i + 1) / b.trail.length;
                            ctx.fillStyle = `rgba(56, 189, 248, ${ratio * 0.45})`;
                            ctx.beginPath();
                            ctx.arc(tr.x, tr.y, b.r * ratio * 0.9, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        ctx.shadowColor = '#38bdf8';
                        ctx.shadowBlur = 18;
                        const bGrad = ctx.createLinearGradient(b.x, b.y - 16, b.x, b.y + 10);
                        bGrad.addColorStop(0, '#ffffff');
                        bGrad.addColorStop(1, '#38bdf8');
                        ctx.fillStyle = bGrad;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });

                    // 8. プレイヤー宇宙ロケット戦闘機の描画（2Dモード時）
                    this.drawTurret(ctx);
                }

                // 9. パーティクル（リアルな炎色反応スパーク＆流体煙）＋3D金属破片デブリ＋稲妻アーク描画
                this.particles.forEach(pt => {
                    ctx.save();
                    ctx.globalAlpha = pt.life / pt.maxLife;
                    if (!pt.isSmoke) {
                        ctx.shadowColor = pt.color;
                        ctx.shadowBlur = 10;
                    }
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                this.debris.forEach(db => {
                    ctx.save();
                    ctx.globalAlpha = db.life / db.maxLife;
                    ctx.translate(db.x, db.y);
                    ctx.rotate(db.rot);
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = db.color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.rect(-db.w / 2, -db.h / 2, db.w, db.h);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });

                this.lightningArcs.forEach(arc => {
                    ctx.save();
                    ctx.globalAlpha = arc.life / arc.maxLife;
                    ctx.strokeStyle = arc.color;
                    ctx.shadowColor = arc.color;
                    ctx.shadowBlur = 14;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    arc.pts.forEach((p, idx) => {
                        if (idx === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.stroke();
                    ctx.restore();
                });

                // 11. 正解／ミスポップアップテキスト描画
                this.popups.forEach(pp => {
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, (pp.life / pp.maxLife) * 1.4);
                    ctx.font = `900 ${pp.size}px "Noto Sans JP", "Inter", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = pp.color;
                    ctx.fillText(pp.text, pp.x, pp.y);
                    ctx.restore();
                });

                // 一時停止中オーバーレイ
                if (this.isPaused) {
                    ctx.fillStyle = 'rgba(3, 7, 18, 0.75)';
                    ctx.fillRect(0, 0, this.W, this.H);
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = '900 36px "Noto Sans JP", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏸ 一時停止中', this.W / 2, this.H / 2);
                }

                ctx.restore();
            }

            /**
             * 元素インベーダーポッド（視認性抜群の元素記号はそのままに、3Dメタリック装甲＆回転電子軌道で超リアル化）
             */
            drawInvaderPod(ctx, inv) {
                const isHintTarget = this.hintHighlightTimer > 0 && this.targetElement && inv.el.sym === this.targetElement.sym;
                const isWrongFlash = inv.flashRedTimer > 0;
                const isAimed = this.laserSightOn && Math.abs(this.turret.x - inv.x) <= inv.w / 2;

                const bobY = Math.sin(this.tick * 0.075 + inv.hoverOffset) * 3.8;

                ctx.save();
                ctx.translate(inv.x, inv.y + bobY);
                ctx.scale(inv.scaleAnim, inv.scaleAnim);

                const hw = inv.w / 2;
                const hh = inv.h / 2;

                // 0. 背後のボーア模型・電子軌道リング（立体的に交差回転する電子 e-）
                ctx.save();
                const orbitAngle = this.tick * 0.03 + inv.hoverOffset;
                ctx.strokeStyle = isHintTarget ? 'rgba(253, 224, 71, 0.45)' : isAimed ? 'rgba(56, 189, 248, 0.38)' : 'rgba(56, 189, 248, 0.16)';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.ellipse(0, 0, hw + 10, hh - 6, Math.sin(orbitAngle) * 0.25, 0, Math.PI * 2);
                ctx.stroke();

                // 軌道上を公転する発光電子ドット
                const ex = Math.cos(this.tick * 0.07 + inv.hoverOffset) * (hw + 10);
                const ey = Math.sin(this.tick * 0.07 + inv.hoverOffset) * (hh - 6);
                ctx.fillStyle = isHintTarget ? '#fde047' : inv.el.flame;
                ctx.shadowColor = inv.el.flame;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(ex, ey, 3.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 1. 下部の2つのホバースラスター脚＋プラズマ噴射光
                const legColor = isWrongFlash ? '#ef4444' : isHintTarget ? '#fde047' : '#38bdf8';
                for (let lx of [-hw + 20, hw - 36]) {
                    // 噴射グロー
                    const jetH = 5 + Math.sin(this.tick * 0.35 + inv.hoverOffset) * 2.5;
                    const jetGrad = ctx.createLinearGradient(0, hh, 0, hh + 7 + jetH);
                    jetGrad.addColorStop(0, legColor);
                    jetGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    ctx.fillStyle = jetGrad;
                    ctx.beginPath();
                    ctx.arc(lx + 8, hh + 5, 6, 0, Math.PI * 2);
                    ctx.fill();

                    // スラスター脚装甲
                    ctx.fillStyle = '#0f2942';
                    ctx.strokeStyle = legColor;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.roundRect(lx, hh - 2, 16, 8, 2.5);
                    ctx.fill();
                    ctx.stroke();
                }

                // 2. 3Dメタリック角丸インベーダーボディ
                const grad = ctx.createLinearGradient(0, -hh, 0, hh);
                if (isWrongFlash) {
                    grad.addColorStop(0, '#991b1b');
                    grad.addColorStop(0.5, '#7f1d1d');
                    grad.addColorStop(1, '#450a0a');
                } else if (isHintTarget) {
                    grad.addColorStop(0, '#a16207');
                    grad.addColorStop(0.5, '#713f12');
                    grad.addColorStop(1, '#422006');
                } else {
                    grad.addColorStop(0, '#234e7a');
                    grad.addColorStop(0.55, '#163554');
                    grad.addColorStop(1, '#0c1f36');
                }

                ctx.shadowColor = isWrongFlash ? '#ef4444' : isHintTarget ? '#fde047' : isAimed ? '#38bdf8' : 'rgba(56, 189, 248, 0.38)';
                ctx.shadowBlur = isHintTarget ? 24 : isAimed ? 18 : 10;

                ctx.fillStyle = grad;
                ctx.strokeStyle = isWrongFlash ? '#f87171' : isHintTarget ? '#fde047' : isAimed ? '#7dd3fc' : '#38bdf8';
                ctx.lineWidth = isHintTarget || isAimed ? 3.2 : 2.4;

                ctx.beginPath();
                ctx.roundRect(-hw, -hh, inv.w, inv.h, 16);
                ctx.fill();
                ctx.stroke();

                // 2.2 内側のメタリックベゼル枠＆四隅のリベット装飾
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(186, 230, 253, 0.16)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(-hw + 5, -hh + 5, inv.w - 10, inv.h - 10, 12);
                ctx.stroke();

                // 上部のガラスキャノピー光沢ハイライト
                const glossGrad = ctx.createLinearGradient(0, -hh + 3, 0, -4);
                glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
                glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
                ctx.fillStyle = glossGrad;
                ctx.beginPath();
                ctx.roundRect(-hw + 8, -hh + 4, inv.w - 16, hh * 0.65, 10);
                ctx.fill();

                // 左上の元素炎色インジケーターLEDドット
                ctx.fillStyle = inv.el.flame;
                ctx.shadowColor = inv.el.flame;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(-hw + 14, -hh + 13, 3, 0, Math.PI * 2);
                ctx.fill();

                // 3. 中央の大きく見やすい元素記号（Cu, S, C, Fe, N, Ag, Ca, Mg...）
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 31px "Inter", "Noto Sans JP", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = isAimed ? '#38bdf8' : 'rgba(0, 0, 0, 0.75)';
                ctx.shadowBlur = isAimed ? 10 : 5;
                ctx.fillText(inv.el.sym, 0, 2);

                ctx.restore();
            }

            /**
             * プレイヤーの本格SF宇宙ロケット戦闘機（3Dメタリック船体・ウイング・コックピット・アフターバーナー・電子ビット）
             */
            drawTurret(ctx) {
                const t = this.turret;
                ctx.save();
                ctx.translate(t.x, t.y + t.recoil);
                ctx.rotate(t.bankAngle);

                // 0. 機体周囲を公転するサポート電子ビット (e- オービター)
                for (let i = 0; i < 2; i++) {
                    const a = this.tick * 0.08 + i * Math.PI;
                    const ox = Math.cos(a) * 44;
                    const oy = Math.sin(a) * 11;
                    ctx.save();
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(ox, oy, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 1. 下部ツイン・アフターバーナーの青いプラズマジェットコア
                const flameLen = 14 + Math.sin(this.tick * 0.5) * 4;
                for (let nx of [-14, 14]) {
                    const fGrad = ctx.createLinearGradient(nx, 16, nx, 16 + flameLen);
                    fGrad.addColorStop(0, '#ffffff');
                    fGrad.addColorStop(0.4, '#38bdf8');
                    fGrad.addColorStop(1, 'rgba(2, 132, 199, 0)');
                    ctx.fillStyle = fGrad;
                    ctx.beginPath();
                    ctx.moveTo(nx - 6, 16);
                    ctx.lineTo(nx + 6, 16);
                    ctx.lineTo(nx, 16 + flameLen);
                    ctx.closePath();
                    ctx.fill();

                    // ノズルリング
                    ctx.fillStyle = '#334155';
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.roundRect(nx - 6, 13, 12, 6, 2);
                    ctx.fill();
                    ctx.stroke();
                }

                // 2. 左右のデルタウイング（主翼＋翼端ナビゲーションライト）
                const wingGrad = ctx.createLinearGradient(-38, -6, 38, 16);
                wingGrad.addColorStop(0, '#0284c7');
                wingGrad.addColorStop(0.5, '#38bdf8');
                wingGrad.addColorStop(1, '#0369a1');
                ctx.fillStyle = wingGrad;
                ctx.strokeStyle = '#bae6fd';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(-38, 12);
                ctx.lineTo(-32, 18);
                ctx.lineTo(-12, 14);
                ctx.lineTo(12, 14);
                ctx.lineTo(32, 18);
                ctx.lineTo(38, 12);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 主翼のパネルライン装飾
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(-16, -2);
                ctx.lineTo(-28, 13);
                ctx.moveTo(16, -2);
                ctx.lineTo(28, 13);
                ctx.stroke();

                // 3. センターロケット機体（立体メタリックホワイト＆シアン装甲）
                const hullGrad = ctx.createLinearGradient(-16, -26, 16, 16);
                hullGrad.addColorStop(0, '#f8fafc');
                hullGrad.addColorStop(0.55, '#bae6fd');
                hullGrad.addColorStop(1, '#0284c7');
                ctx.fillStyle = hullGrad;
                ctx.strokeStyle = '#e0f2fe';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(0, -26);
                ctx.lineTo(-15, 4);
                ctx.lineTo(-12, 16);
                ctx.lineTo(12, 16);
                ctx.lineTo(15, 4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 4. 先端のゴールデン・プラズマノーズコーン（オリジナルの黄色い三角先端をリアルSF化！）
                ctx.save();
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 14;
                const coneGrad = ctx.createLinearGradient(0, -38, 0, -18);
                coneGrad.addColorStop(0, '#fef08a');
                coneGrad.addColorStop(0.5, '#f59e0b');
                coneGrad.addColorStop(1, '#b45309');
                ctx.fillStyle = coneGrad;
                ctx.beginPath();
                ctx.moveTo(0, -38);
                ctx.lineTo(-9, -18);
                ctx.lineTo(9, -18);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // 5. ガラスコックピット・キャノピー
                const GlassGrad = ctx.createLinearGradient(0, -14, 0, 6);
                GlassGrad.addColorStop(0, '#0f172a');
                GlassGrad.addColorStop(0.4, '#0284c7');
                GlassGrad.addColorStop(1, '#38bdf8');
                ctx.fillStyle = GlassGrad;
                ctx.strokeStyle = '#7dd3fc';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.ellipse(0, -3, 6, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // キャノピーのハイライト反射
                ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                ctx.beginPath();
                ctx.ellipse(-2, -6, 1.8, 4.5, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // 6. 発射時のマズルフラッシュ発光
                if (t.muzzleFlash > 0) {
                    ctx.save();
                    ctx.shadowColor = '#fde047';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, -39, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }

            /**
             * 元素記号の暗記一覧モーダル（プリントと完全一致する左右2列テーブル形式で表示！）
             */
            renderGuideModal() {
                const grid = document.getElementById('guideGrid');
                if (!grid) return;

                const leftItems = ELEMENTS_LIST.filter(e => e.colGroup === 'left');
                const rightItems = ELEMENTS_LIST.filter(e => e.colGroup === 'right');

                const renderColumnTable = (items) => `
                    <div class="rounded-xl overflow-hidden border border-slate-700 bg-slate-950">
                        <div class="grid grid-cols-2 bg-slate-800/90 text-slate-200 font-black text-xs sm:text-sm py-2 px-3 border-b border-slate-700 text-center">
                            <div>元素名</div>
                            <div>元素記号</div>
                        </div>
                        <div class="divide-y divide-slate-800">
                            ${items.map(el => `
                                <button onclick="sound.speakJa('${el.name}')" class="w-full grid grid-cols-2 items-center py-2.5 px-3 hover:bg-sky-950/60 transition text-center group">
                                    <div class="flex flex-col items-center">
                                        <span class="font-black text-base sm:text-lg text-white group-hover:text-amber-300 transition">${el.name}</span>
                                        <span class="text-[10px] text-slate-400">${el.hint}</span>
                                    </div>
                                    <div class="font-cyber font-black text-2xl sm:text-3xl text-sky-300 group-hover:scale-110 transition-transform">
                                        ${el.sym}
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                grid.innerHTML = renderColumnTable(leftItems) + renderColumnTable(rightItems);
            }

            openGuideModal() {
                this.pausedByGuide = !this.isPaused && !this.isGameOver;
                if (this.pausedByGuide) this.togglePause();
                document.getElementById('modalGuide').classList.remove('hidden');
            }

            closeGuideModal() {
                document.getElementById('modalGuide').classList.add('hidden');
                // 説明を開く時に止めた場合だけ、閉じた時に再開する（自分で止めた時は止めたままにする）
                if (this.pausedByGuide) { this.pausedByGuide = false; if (this.isPaused && !this.isGameOver) this.togglePause(); }
            }
        }

        // ゲーム起動
        let game;
        window.onload = function () {
            game = new ElementQuizInvaders();
            function animate() {
                game.update();
                game.draw();
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        };
        // キャンバスの表示の大きさを、枠の中で16:10のまま最大にする（操作の座標がずれないように、表示と計算の大きさを同じにする）
        function fitBoard() {
            const w = document.getElementById('canvasWrapper');
            if (!w) return;
            const bw = w.clientWidth, bh = w.clientHeight;
            if (!bw || !bh) return;
            let cw = bw, ch = bw * 10 / 16;
            if (ch > bh) { ch = bh; cw = bh * 16 / 10; }
            ['webglCanvas', 'gameCanvas'].forEach(id => {
                const c = document.getElementById(id);
                if (c) { c.style.width = Math.floor(cw) + 'px'; c.style.height = Math.floor(ch) + 'px'; }
            });
        }
        window.addEventListener('load', fitBoard);
        window.addEventListener('resize', fitBoard);
    </script>
</body>
