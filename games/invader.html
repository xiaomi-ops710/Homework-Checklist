<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元素インベーダー ULTRA | 正しい元素記号を撃ち抜け！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js (WebGL 3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #10203a 0%, #070e1c 55%, #030710 100%);
            color: #f1f5f9;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }

        /* ステータスカードのガラス質感 */
        .stat-card {
            background: linear-gradient(180deg, rgba(22, 37, 65, 0.92) 0%, rgba(14, 24, 44, 0.95) 100%);
            border: 1px solid rgba(71, 118, 182, 0.45);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* 黄金のターゲットバナー（オリジナル完全再現＋発光強化） */
        .target-banner {
            background: linear-gradient(135deg, #fde068 0%, #f7cb45 50%, #eab308 100%);
            box-shadow: 0 0 28px rgba(250, 204, 21, 0.38), inset 0 2px 2px rgba(255, 255, 255, 0.65);
            border: 2px solid #fef08a;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .target-banner.pop-anim {
            transform: scale(1.025);
        }

        /* キャンバス枠 */
        .canvas-frame {
            background: radial-gradient(ellipse at 50% 25%, #0c1f3f 0%, #050d1d 65%, #020409 100%);
            border: 2px solid #38bdf8;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.28), inset 0 0 36px rgba(56, 189, 248, 0.16);
        }

        .ctrl-btn {
            transition: all 0.15s ease;
        }
        .ctrl-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.12);
        }
        .ctrl-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        /* 画面シェイクアニメーション */
        @keyframes shake-red {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .animate-miss {
            animation: shake-red 0.35s ease;
            border-color: #ef4444 !important;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.55) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-2 px-2 sm:px-4">

    <!-- ==================== メインコンテナ ==================== -->
    <div class="max-w-[1500px] w-full mx-auto flex flex-col gap-2.5 flex-1">

        <!-- 1. 最上部コントロールバー（速さ・出題範囲・一時停止・音・BGM・最初から・図鑑） -->
        <header class="flex flex-wrap items-center justify-center sm:justify-between gap-2 bg-slate-900/80 backdrop-blur-md px-3 py-2 rounded-xl border border-slate-700/70">
            <!-- ロゴ＆タイトル -->
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-crosshairs text-white text-sm"></i>
                </div>
                <div>
                    <span class="font-black text-sm sm:text-base tracking-wide text-white">元素インベーダー</span>
                    <span class="ml-1 text-[10px] font-cyber px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40 font-bold">ULTRA</span>
                </div>
            </div>

            <!-- オリジナル準拠＋強化コントロール群 -->
            <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 text-xs sm:text-sm">
                <!-- 3D / 2D グラフィックモード切替（新機能） -->
                <button id="btn3DMode" tabindex="-1" onclick="this.blur(); game.toggle3DMode()" class="ctrl-btn px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 border border-cyan-300/70 text-white font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-md shadow-cyan-500/30">
                    <i class="fa-solid fa-cube text-cyan-200 animate-spin" style="animation-duration: 6s;"></i>
                    <span id="lbl3DMode">3Dモード: ON</span>
                </button>

                <!-- 3Dカメラアングル切替（新機能） -->
                <button id="btnCamAngle" tabindex="-1" onclick="this.blur(); game.cycleCameraMode()" class="ctrl-btn px-2.5 py-1.5 rounded-lg bg-slate-800/95 hover:bg-slate-700 border border-cyan-400/40 text-cyan-200 font-bold text-xs sm:text-sm flex items-center gap-1" title="3Dカメラアングルを切り替えます">
                    <i class="fa-solid fa-video text-xs"></i>
                    <span id="lblCamAngle">視点: ダイナミック</span>
                </button>

                <!-- 速さセレクト -->
                <div class="flex items-center gap-1.5 bg-slate-800/90 px-2.5 py-1.5 rounded-lg border border-slate-600">
                    <label for="selectSpeed" class="text-slate-300 font-bold text-xs">速さ</label>
                    <select id="selectSpeed" tabindex="-1" onchange="this.blur(); game.changeSpeed(this.value)" class="bg-slate-900 text-white font-bold rounded px-2 py-0.5 border border-slate-600 focus:outline-none focus:border-sky-400 text-xs sm:text-sm">
                        <option value="slow">ゆっくり</option>
                        <option value="normal" selected>ふつう</option>
                        <option value="fast">はやい</option>
                        <option value="super">超高速</option>
                    </select>
                </div>

                <!-- BGMトラック切替（3D立体音響・美旋律BGM） -->
                <div class="flex items-center gap-1.5 bg-slate-800/90 px-2.5 py-1.5 rounded-lg border border-slate-600">
                    <label for="selectBgmTrack" class="text-sky-300 font-bold text-xs"><i class="fa-solid fa-headphones Simple mr-1"></i>曲</label>
                    <select id="selectBgmTrack" tabindex="-1" onchange="this.blur(); sound.changeTrack(this.value)" class="bg-slate-900 text-white font-bold rounded px-2 py-0.5 border border-slate-600 focus:outline-none focus:border-sky-400 text-xs sm:text-sm">
                        <option value="cyber" selected>1. COSMIC AURORA (立体美旋律)</option>
                        <option value="galactic">2. STELLAR SYMPHONY (幻想交響)</option>
                        <option value="overdrive">3. QUANTUM HORIZON (疾走重低音)</option>
                    </select>
                </div>

                <!-- 一時停止ボタン -->
                <button id="btnPause" tabindex="-1" onclick="this.blur(); game.togglePause()" class="ctrl-btn px-3 py-1.5 rounded-lg bg-[#1e3a5f] hover:bg-[#284d7e] border border-sky-400/40 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5">
                    <i id="iconPause" class="fa-solid fa-pause text-xs"></i>
                    <span id="lblPause">一時停止</span>
                </button>

                <!-- 効果音＆ボイス ON/OFF -->
                <button id="btnSound" tabindex="-1" onclick="this.blur(); sound.toggleSfx()" class="ctrl-btn px-3 py-1.5 rounded-lg bg-[#1e3a5f] hover:bg-[#284d7e] border border-sky-400/40 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5">
                    <span id="lblSound">🔊 音 ON</span>
                </button>

                <!-- BGM ON/OFF -->
                <button id="btnBgm" tabindex="-1" onclick="this.blur(); sound.toggleBgm()" class="ctrl-btn px-3 py-1.5 rounded-lg bg-[#1e3a5f] hover:bg-[#284d7e] border border-sky-400/40 text-sky-200 font-bold text-xs sm:text-sm flex items-center gap-1">
                    <i class="fa-solid fa-music text-xs"></i>
                    <span id="lblBgm">BGM ON</span>
                </button>

                <!-- 最初からボタン -->
                <button tabindex="-1" onclick="this.blur(); game.restartGame()" class="ctrl-btn px-3 py-1.5 rounded-lg bg-[#1e3a5f] hover:bg-[#2b588f] border border-sky-400/50 text-white font-bold text-xs sm:text-sm flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                    <span>最初から</span>
                </button>

                <!-- 元素一覧・図鑑ボタン -->
                <button tabindex="-1" onclick="this.blur(); game.openGuideModal()" class="ctrl-btn px-2.5 py-1.5 rounded-lg bg-indigo-900/90 hover:bg-indigo-800 border border-indigo-400/50 text-indigo-100 font-bold text-xs sm:text-sm flex items-center gap-1" title="元素記号一覧表を見る">
                    <i class="fa-solid fa-book-open text-amber-300"></i>
                    <span class="hidden md:inline">暗記表</span>
                </button>
            </div>
        </header>

        <!-- 2. 4つの大型ステータスパネル（得点・残り時間・ミス・最高得点） -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">
            <div class="stat-card rounded-xl p-2.5 flex flex-col justify-center items-center">
                <span class="text-[11px] font-bold text-slate-400 tracking-wider">得点</span>
                <span id="uiScore" class="font-cyber font-black text-2xl sm:text-3xl text-sky-400">0</span>
            </div>
            <div id="cardTime" class="stat-card rounded-xl p-2.5 flex flex-col justify-center items-center relative overflow-hidden">
                <div class="absolute bottom-0 left-0 w-full h-1 bg-slate-800"><div id="uiTimeBar" class="h-full bg-sky-400 transition-all duration-300" style="width: 100%;"></div></div>
                <span class="text-[11px] font-bold text-slate-400 tracking-wider">残り時間</span>
                <span id="uiTime" class="font-cyber font-black text-2xl sm:text-3xl text-amber-300">90</span>
            </div>
            <div id="cardMiss" class="stat-card rounded-xl p-2.5 flex flex-col justify-center items-center">
                <span class="text-[11px] font-bold text-slate-400 tracking-wider">ミス / 限界</span>
                <span id="uiMiss" class="font-cyber font-black text-2xl sm:text-3xl text-rose-400">0 / 5</span>
            </div>
            <div class="stat-card rounded-xl p-2.5 flex flex-col justify-center items-center">
                <span class="text-[11px] font-bold text-slate-400 tracking-wider">最高得点</span>
                <span id="uiHighScore" class="font-cyber font-black text-2xl sm:text-3xl text-emerald-400">5</span>
            </div>
        </section>

        <!-- 3. 黄金の「🎯 狙う元素」バナー（オリジナル完全再現＋コンボバッジ） -->
        <div id="targetBanner" class="target-banner rounded-xl px-4 py-2.5 flex items-center justify-between text-slate-950 font-black shadow-lg">
            <div class="flex items-center gap-2.5">
                <i class="fa-solid fa-bullseye text-red-600 text-lg animate-pulse"></i>
                <div class="flex items-baseline gap-2">
                    <span class="text-xs sm:text-sm bg-slate-950/15 px-2 py-0.5 rounded-md font-extrabold">🎯 狙う元素</span>
                    <span id="uiTargetName" class="font-cyber font-black text-lg sm:text-xl tracking-wide text-slate-950">ナトリウム</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="uiTargetHint" class="hidden sm:inline text-xs font-bold text-slate-900 bg-white/40 px-2.5 py-1 rounded-lg border border-yellow-300">
                    原子番号11 / 食塩の成分
                </span>
                <div id="uiComboBadge" class="hidden font-cyber font-black text-xs px-2 py-0.5 rounded bg-red-600 text-white animate-bounce">
                    🔥2連続!
                </div>
            </div>
        </div>

        <!-- 4. メインゲームキャンバスエリア（WebGL 3D Canvas ＋ 2D HUD Canvas ハイブリッド構造） -->
        <div id="canvasWrapper" class="canvas-frame rounded-2xl relative overflow-hidden w-full flex-1 min-h-[240px] flex items-center justify-center">
            <!-- Three.js 超高精細3Dレンダリング層 -->
            <canvas id="webglCanvas" width="960" height="600" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></canvas>
            <!-- 2D UI・照準・エフェクト＆タッチ操作層 -->
            <canvas id="gameCanvas" tabindex="0" width="960" height="600" class="relative z-10 cursor-crosshair focus:outline-none"></canvas>

            <!-- ゲームオーバー時のモーダルオーバーレイ -->
            <div id="overlayResult" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 z-20 text-center animate-fade-in">
                <div class="w-14 h-14 rounded-2xl bg-amber-500/20 border border-amber-400 flex items-center justify-center mb-3 text-amber-400 text-2xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 id="resultBadge" class="font-cyber font-black text-2xl sm:text-3xl text-white mb-1">GAME OVER</h2>
                <p id="resultSub" class="text-xs sm:text-sm text-slate-300 mb-4">よくがんばりました！</p>
                
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-3.5 max-w-sm w-full mb-4 grid grid-cols-3 gap-2 text-center">
                    <div>
                        <div class="text-[10px] text-slate-400">スコア</div>
                        <div id="resFinalScore" class="font-cyber font-black text-xl text-sky-400">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400">最大コンボ</div>
                        <div id="resMaxCombo" class="font-cyber font-black text-xl text-amber-300">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400">ベスト</div>
                        <div id="resBestScore" class="font-cyber font-black text-xl text-emerald-400">5</div>
                    </div>
                </div>

                <!-- 間違えた元素の復習リスト -->
                <div class="max-w-md w-full mb-4 text-left">
                    <div class="text-xs font-bold text-slate-400 mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-book-medical text-sky-400"></i> 今回登場した主な元素の復習
                    </div>
                    <div id="reviewList" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto pr-1"></div>
                </div>

                <button onclick="game.restartGame(true)" class="ctrl-btn px-6 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-black text-sm shadow-lg shadow-sky-500/30 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> もう一度挑戦する
                </button>
            </div>
        </div>

        <!-- 5. モバイル・タブレット・PC共通の補助操作バー（左右移動・発射・ヒント・凍結） -->
        <footer class="grid grid-cols-5 gap-2">
            <button id="btnLeft" class="ctrl-btn py-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600 text-white font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95">
                <i class="fa-solid fa-angles-left text-sm text-sky-400"></i>
                <span class="text-[10px]">左移動</span>
            </button>
            <button id="btnFire" class="ctrl-btn py-3 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 border border-sky-400 text-white font-black flex flex-col items-center justify-center gap-0.5 shadow-md shadow-sky-500/30 active:scale-95">
                <i class="fa-solid fa-crosshairs text-sm"></i>
                <span class="text-[10px]">発射!</span>
            </button>
            <button id="btnRight" class="ctrl-btn py-3 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600 text-white font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95">
                <i class="fa-solid fa-angles-right text-sm text-sky-400"></i>
                <span class="text-[10px]">右移動</span>
            </button>
            <button onclick="game.useScannerHint()" class="ctrl-btn py-3 rounded-xl bg-amber-950/80 hover:bg-amber-900 border border-amber-600/60 text-amber-200 font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95" title="正解の元素をキラッと光らせるヒント">
                <i class="fa-solid fa-lightbulb text-sm text-amber-300"></i>
                <span class="text-[10px]">ヒント(H)</span>
            </button>
            <button onclick="game.activateCryoFreeze()" class="ctrl-btn py-3 rounded-xl bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-600/60 text-cyan-200 font-bold flex flex-col items-center justify-center gap-0.5 active:scale-95" title="5秒間時間を凍結">
                <i class="fa-solid fa-snowflake text-sm text-cyan-300"></i>
                <span class="text-[10px]">凍結(<span id="lblCryoCount">3</span>)</span>
            </button>
        </footer>
    </div>

    <!-- ==================== モーダル：元素記号 暗記一覧表（プリント完全準拠13元素） ==================== -->
    <div id="modalGuide" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-3">
        <div class="bg-slate-900 border border-sky-500/50 rounded-2xl max-w-3xl w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-amber-400 text-lg"></i>
                    <h2 class="font-black text-base sm:text-lg text-white">出題される13種類の元素・暗記一覧表</h2>
                </div>
                <button onclick="game.closeGuideModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto">
                <p class="text-xs sm:text-sm text-slate-300 mb-3">
                    このゲームに出題される<strong class="text-amber-300">全13種類の元素名と元素記号</strong>です。行をクリックすると発音＆ヒントを確認できます。
                </p>
                <div id="guideGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- JSでプリントと同じ左右2列構成で生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ゲームエンジン ==================== -->
    <script>
        // 古いiPad Safari（roundRect 未対応）でも描画が止まらないように、簡単な代わりの関数を用意する
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                const rad = Math.max(0, Math.min(Array.isArray(r) ? (r[0] || 0) : (r || 0), w / 2, h / 2));
                this.moveTo(x + rad, y);
                this.arcTo(x + w, y, x + w, y + h, rad);
                this.arcTo(x + w, y + h, x, y + h, rad);
                this.arcTo(x, y + h, x, y, rad);
                this.arcTo(x, y, x + w, y, rad);
                this.closePath();
                return this;
            };
        }
        /**
         * ============================================================================
         * 1. 元素データベース（ご指定のプリント13種類に完全限定！）
         * ============================================================================
         */
        const ELEMENTS_LIST = [
            // 左列の7元素
            { z: 1,  sym: 'H',  name: '水素',         colGroup: 'left',  hint: '最も軽い気体・水の成分',             flame: '#38bdf8', metalColor: '#0ea5e9' },
            { z: 6,  sym: 'C',  name: '炭素',         colGroup: 'left',  hint: 'ダイヤモンド・鉛筆の芯・有機物',     flame: '#fb923c', metalColor: '#64748b' },
            { z: 7,  sym: 'N',  name: '窒素',         colGroup: 'left',  hint: '空気の約78%を占める気体',            flame: '#60a5fa', metalColor: '#3b82f6' },
            { z: 8,  sym: 'O',  name: '酸素',         colGroup: 'left',  hint: 'ものを燃やすはたらきがある気体',     flame: '#00f3ff', metalColor: '#06b6d4' },
            { z: 11, sym: 'Na', name: 'ナトリウム',   colGroup: 'left',  hint: '食塩(NaCl)の成分・黄色の炎色反応',   flame: '#fde047', metalColor: '#eab308' },
            { z: 12, sym: 'Mg', name: 'マグネシウム', colGroup: 'left',  hint: '燃えると白い強い光を出す金属',       flame: '#f8fafc', metalColor: '#94a3b8' },
            { z: 16, sym: 'S',  name: '硫黄',         colGroup: 'left',  hint: '温泉や火山の成分・黄色い非金属',     flame: '#facc15', metalColor: '#ca8a04' },

            // 右列の6元素
            { z: 17, sym: 'Cl', name: '塩素',         colGroup: 'right', hint: 'プールの消毒・黄緑色の気体',         flame: '#a3e635', metalColor: '#65a30d' },
            { z: 20, sym: 'Ca', name: 'カルシウム',   colGroup: 'right', hint: '骨や歯・石灰石の成分・橙赤色の炎',   flame: '#fb923c', metalColor: '#f97316' },
            { z: 26, sym: 'Fe', name: '鉄',           colGroup: 'right', hint: '磁石につく代表的な金属・スチール',   flame: '#fbbf24', metalColor: '#78716c' },
            { z: 29, sym: 'Cu', name: '銅',           colGroup: 'right', hint: '10円玉や電線・青緑色の炎色反応',     flame: '#2dd4bf', metalColor: '#d97706' },
            { z: 30, sym: 'Zn', name: '亜鉛',         colGroup: 'right', hint: '真鍮(黄銅)や乾電池に使われる金属',   flame: '#67e8f9', metalColor: '#71717a' },
            { z: 47, sym: 'Ag', name: '銀',           colGroup: 'right', hint: '電気や熱を最もよく通す白い貴金属',   flame: '#e2e8f0', metalColor: '#cbd5e1' }
        ];

        /**
         * ============================================================================
         * 2. 3D立体音響（バイノーラルステレオパン・ホールリバーブ・ピンポンディレイ）＆
         *    美旋律シンフォニック・トランスBGM＆豪華効果音エンジン
         * ============================================================================
         */
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.subBassBoost = null;
                this.highEnhancer = null;
                this.compressor = null;
                this.convolver = null;
                this.reverbGain = null;
                this.delayL = null;
                this.delayR = null;
                this.panL = null;
                this.panR = null;
                this.analyser = null;
                this.freqData = new Uint8Array(32);
                this.sfxOn = true;
                this.bgmOn = true;
                this.bgmTrack = 'cyber'; // 'cyber', 'galactic', 'overdrive'
                this.bgmTimer = null;
                this.bgmStep = 0;
                this.noiseBuffer = null;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        this.ctx = new AudioCtx();

                        // 1. 豊かな重低音サブベース・ウォームブースト (85Hz以下を+6.5dB)
                        this.subBassBoost = this.ctx.createBiquadFilter();
                        this.subBassBoost.type = 'lowshelf';
                        this.subBassBoost.frequency.setValueAtTime(85, this.ctx.currentTime);
                        this.subBassBoost.gain.setValueAtTime(6.5, this.ctx.currentTime);

                        // 2. クリスタル高域エアーエンハンサー (6000Hz以上を+4dBで透明感アップ)
                        this.highEnhancer = this.ctx.createBiquadFilter();
                        this.highEnhancer.type = 'highshelf';
                        this.highEnhancer.frequency.setValueAtTime(6000, this.ctx.currentTime);
                        this.highEnhancer.gain.setValueAtTime(4.0, this.ctx.currentTime);

                        // 3. マスタリング・リミッター/コンプレッサー
                        this.compressor = this.ctx.createDynamicsCompressor();
                        this.compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
                        this.compressor.knee.setValueAtTime(12, this.ctx.currentTime);
                        this.compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
                        this.compressor.attack.setValueAtTime(0.005, this.ctx.currentTime);
                        this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.setValueAtTime(0.90, this.ctx.currentTime);

                        // 4. 立体音響：カスタム生成ステレオ・コズミックホール・リバーブ (ConvolverNode)
                        this.convolver = this.ctx.createConvolver();
                        this.convolver.buffer = this.createStereoReverbBuffer(2.4, 2.8);
                        this.reverbGain = this.ctx.createGain();
                        this.reverbGain.gain.setValueAtTime(0.34, this.ctx.currentTime);
                        this.convolver.connect(this.reverbGain);
                        this.reverbGain.connect(this.highEnhancer);

                        // 5. 立体音響：ピンポン・ステレオディレイ (L/Rに交互に広がる3D空間エコー)
                        this.delayL = this.ctx.createDelay(1.0);
                        this.delayR = this.ctx.createDelay(1.0);
                        this.delayL.delayTime.setValueAtTime(0.24, this.ctx.currentTime);
                        this.delayR.delayTime.setValueAtTime(0.36, this.ctx.currentTime);

                        const fbL = this.ctx.createGain();
                        const fbR = this.ctx.createGain();
                        fbL.gain.setValueAtTime(0.32, this.ctx.currentTime);
                        fbR.gain.setValueAtTime(0.32, this.ctx.currentTime);

                        const dFilter = this.ctx.createBiquadFilter();
                        dFilter.type = 'bandpass';
                        dFilter.frequency.setValueAtTime(2200, this.ctx.currentTime);
                        dFilter.Q.setValueAtTime(0.7, this.ctx.currentTime);

                        this.panL = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
                        this.panR = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
                        if (this.panL && this.panR) {
                            this.panL.pan.setValueAtTime(-0.78, this.ctx.currentTime);
                            this.panR.pan.setValueAtTime(0.78, this.ctx.currentTime);
                            this.delayL.connect(this.panL);
                            this.delayR.connect(this.panR);
                            this.panL.connect(dFilter);
                            this.panR.connect(dFilter);
                        } else {
                            this.delayL.connect(dFilter);
                            this.delayR.connect(dFilter);
                        }
                        this.delayL.connect(fbL);
                        fbL.connect(this.delayR);
                        this.delayR.connect(fbR);
                        fbR.connect(this.delayL);
                        dFilter.connect(this.highEnhancer);

                        this.analyser = this.ctx.createAnalyser();
                        this.analyser.fftSize = 64;
                        this.analyser.smoothingTimeConstant = 0.78;

                        // マスタリングルーティング接続
                        this.masterGain.connect(this.subBassBoost);
                        this.subBassBoost.connect(this.highEnhancer);
                        this.highEnhancer.connect(this.compressor);
                        this.compressor.connect(this.analyser);
                        this.analyser.connect(this.ctx.destination);

                        this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                        this.createNoiseBuffer();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {}
            }

            // ステレオ・インパルス応答（美しい宇宙空間ホール残響）の生成
            createStereoReverbBuffer(duration = 2.4, decay = 2.8) {
                const rate = this.ctx.sampleRate;
                const length = Math.floor(rate * duration);
                const impulse = this.ctx.createBuffer(2, length, rate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);
                for (let i = 0; i < length; i++) {
                    const n = i / length;
                    const env = Math.pow(1 - n, decay);
                    left[i] = (Math.random() * 2 - 1) * env;
                    right[i] = (Math.random() * 2 - 1) * env;
                }
                return impulse;
            }

            createNoiseBuffer() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                this.noiseBuffer = buffer;
            }

            // 3Dステレオパンノードを生成（左右 -1.0 〜 +1.0 の立体定位）
            createPanner(panVal = 0) {
                const dest = this.masterGain || this.ctx.destination;
                if (this.ctx && this.ctx.createStereoPanner) {
                    const p = this.ctx.createStereoPanner();
                    p.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal)), this.ctx.currentTime);
                    p.connect(dest);
                    return p;
                }
                return dest;
            }

            getSpectrum() {
                if (this.analyser && (this.bgmOn || this.sfxOn) && this.ctx && this.ctx.state === 'running') {
                    this.analyser.getByteFrequencyData(this.freqData);
                    return this.freqData;
                }
                return null;
            }

            changeTrack(trackName) {
                this.init();
                this.bgmTrack = trackName;
                this.bgmStep = 0;
                if (this.bgmOn) this.startBgm();
            }

            toggleSfx() {
                this.init();
                this.sfxOn = !this.sfxOn;
                document.getElementById('lblSound').textContent = this.sfxOn ? '🔊 音 ON' : '🔇 音 OFF';
                if (this.sfxOn) this.playShot(0);
            }

            toggleBgm() {
                this.init();
                this.bgmOn = !this.bgmOn;
                document.getElementById('lblBgm').textContent = this.bgmOn ? 'BGM ON' : 'BGM OFF';
                if (this.bgmOn) {
                    this.startBgm();
                } else {
                    this.stopBgm();
                }
            }

            speakJa(text) {
                if (!this.sfxOn || !('speechSynthesis' in window)) return;
                try {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'ja-JP';
                    u.rate = 1.25;
                    u.pitch = 1.08;
                    u.volume = 0.65;
                    window.speechSynthesis.speak(u);
                } catch (e) {}
            }

            startBgm() {
                this.init();
                this.stopBgm();
                if (!this.bgmOn || !this.ctx) return;

                const tick = () => {
                    if (!this.bgmOn || !game || game.isPaused || game.isGameOver) return;
                    this.playBgmStep(this.bgmStep);
                    this.bgmStep = (this.bgmStep + 1) % 128;

                    let baseTempo = this.bgmTrack === 'overdrive' ? 108 : this.bgmTrack === 'galactic' ? 118 : 114;
                    if (game.timeLeft <= 20) baseTempo *= 0.90;
                    const speedMult = game.speedMode === 'super' ? 0.88 : game.speedMode === 'fast' ? 0.94 : game.speedMode === 'slow' ? 1.06 : 1.0;
                    this.bgmTimer = setTimeout(tick, Math.floor(baseTempo * speedMult));
                };
                tick();
            }

            stopBgm() {
                if (this.bgmTimer) {
                    clearTimeout(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }

            /**
             * 3D立体音響・美旋律シンフォニックBGMシーケンサー
             * - ステレオ・ホールリバーブ＋左右ピンポンディレイ＋3Dオートパンニングで包み込まれる立体音響！
             */
            playBgmStep(step) {
                if (!this.ctx || !this.bgmOn) return;
                try {
                    const now = this.ctx.currentTime;
                    const dest = this.masterGain || this.ctx.destination;
                    const s32 = step % 32;
                    const section = step < 32 ? 'A' : step < 64 ? 'B' : 'DROP';
                    const isDrop = section === 'DROP';

                    const tracks = {

                                [164.81, 246.94, 293.66, 329.63, 392.00], // Em7

                        overdrive: {
                            // 3. QUANTUM HORIZON: 疾走感と高揚感あふれる王道シューティング・トランス (F#m7 -> Dmaj7 -> E -> C#m7)
                            subRoot: [46.25, 36.71, 41.20, 34.65],
                            bass: [
                                92.50, 185.00, 92.50, 185.00, 92.50, 185.00, 164.81, 185.00,
                                73.42, 146.83, 73.42, 146.83, 73.42, 146.83, 164.81, 146.83,

                    const cur = tracks[this.bgmTrack] || tracks.cyber;
                    const barIdx = Math.floor(s32 / 8) % 4;
                    const isFillBar = (step >= 56 && step < 64) || (step >= 120);

                    // 1. ウォーム＆ディープ・サブキック (耳に優しくお腹に響く高品位キック)
                    if ((s32 % 4 === 0) || (isDrop && s32 === 30)) {
                        const kickOsc = this.ctx.createOscillator();
                        const kickGain = this.ctx.createGain();
                        kickOsc.type = 'sine';
                        kickOsc.frequency.setValueAtTime(175, now);
                        kickOsc.frequency.exponentialRampToValueAtTime(46, now + 0.055);
                        kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                        kickGain.gain.setValueAtTime(0.62, now);
                        kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
                        kickOsc.connect(kickGain);
                        kickGain.connect(dest);
                        kickOsc.start(now);
                        kickOsc.stop(now + 0.35);
                    }

                    // 2. クリスプ・リムスネア＆シルキー・ステレオハイハット
                    if (this.noiseBuffer) {
                        const isSnareHit = (s32 % 8 === 4) || (isFillBar && step % 2 === 1);
                        if (isSnareHit) {
                            const noise = this.ctx.createBufferSource();
                            noise.buffer = this.noiseBuffer;
                            const filter = this.ctx.createBiquadFilter();
                            filter.type = 'bandpass';
                            filter.frequency.setValueAtTime(2400, now);
                            const nGain = this.ctx.createGain();
                            nGain.gain.setValueAtTime(isFillBar ? 0.09 : 0.14, now);
                            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                            noise.connect(filter);
                            filter.connect(nGain);
                            nGain.connect(dest);
                            if (this.convolver) nGain.connect(this.convolver);
                            noise.start(now);
                            noise.stop(now + 0.17);
                            // 手拍子（クラップ）を重ねて、スネアを厚くする
                            const cl = this.ctx.createBufferSource();
                            cl.buffer = this.noiseBuffer;
                            const cf = this.ctx.createBiquadFilter();
                            cf.type = 'bandpass';
                            cf.frequency.setValueAtTime(1150, now);
                            cf.Q.setValueAtTime(0.9, now);
                            const cg = this.ctx.createGain();
                            cg.gain.setValueAtTime(0.0001, now);
                            cg.gain.linearRampToValueAtTime(0.11, now + 0.006);
                            cg.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                            cl.connect(cf);
                            cf.connect(cg);
                            cg.connect(dest);
                            cl.start(now);
                            cl.stop(now + 0.21);
                        }

                        // ステレオに揺れるシルキーハイハット
                        const isOpenHat = s32 % 4 === 2;
                        const hh = this.ctx.createBufferSource();
                        hh.buffer = this.noiseBuffer;
                        const hFilter = this.ctx.createBiquadFilter();
                        hFilter.type = 'highpass';
                        hFilter.frequency.setValueAtTime(8500, now);
                        const hGain = this.ctx.createGain();
                        const dur = isOpenHat ? 0.085 : 0.028;
                        hGain.gain.setValueAtTime(isOpenHat ? 0.038 : 0.018, now);
                        hGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                        const hhPan = this.createPanner(Math.sin(step * 0.5) * 0.45);
                        hh.connect(hFilter);
                        hFilter.connect(hGain);
                        hGain.connect(hhPan);
                        hh.start(now);
                        hh.stop(now + dur + 0.01);
                    }

                    // 3. 3Dディープ・ウォームサブベース & ベルベットベース
                    if (s32 % 4 !== 0) {
                        const subFreq = cur.subRoot[barIdx];
                        if (subFreq) {
                            const subSine = this.ctx.createOscillator();
                            const subGain = this.ctx.createGain();
                            subSine.type = 'sine';
                            subSine.frequency.setValueAtTime(subFreq * 1.9, now);
                            subSine.frequency.exponentialRampToValueAtTime(subFreq, now + 0.07);
                            subGain.gain.setValueAtTime(isDrop ? 0.34 : 0.26, now);
                            subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
                            subSine.connect(subGain);
                            subGain.connect(dest);
                            subSine.start(now);
                            subSine.stop(now + 0.25);
                        }
                    }

                    const bFreq = cur.bass[s32];
                    if (bFreq > 0) {
                        // 重低音のリース・ベース：少しずらした2本のノコギリ波を重ねて、厚く唸らせる
                        [-11, 11].forEach(det => {
                            const bOsc = this.ctx.createOscillator();
                            const bFilter = this.ctx.createBiquadFilter();
                            const bGain = this.ctx.createGain();
                            bOsc.type = 'sawtooth';
                            bOsc.frequency.setValueAtTime(bFreq, now);
                            bOsc.detune.setValueAtTime(det, now);
                            bFilter.type = 'lowpass';
                            bFilter.Q.setValueAtTime(7, now);
                            bFilter.frequency.setValueAtTime(isDrop ? 1500 : 1000, now);
                            bFilter.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                            bGain.gain.setValueAtTime(0.075, now);
                            bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                            bOsc.connect(bFilter);
                            bFilter.connect(bGain);
                            bGain.connect(dest);
                            bOsc.start(now);
                            bOsc.stop(now + 0.23);
                        });
                        // 1オクターブ下の正弦波（床が震えるような低さ）
                        const low = this.ctx.createOscillator();
                        const lowG = this.ctx.createGain();
                        low.type = 'sine';
                        low.frequency.setValueAtTime(bFreq / 2, now);
                        lowG.gain.setValueAtTime(0.12, now);
                        lowG.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                        low.connect(lowG);
                        lowG.connect(dest);
                        low.start(now);
                        low.stop(now + 0.19);
                    }

                    // 4. 3Dワイドステレオ・シンフォニックパッド和音（左右の空間に広がる美しいコードパッド）
                    if (s32 % 8 === 0 || (isDrop && s32 % 4 === 2)) {
                        const chord = cur.chords[barIdx];
                        const dur = s32 % 8 === 0 ? 0.72 : 0.28;
                        chord.forEach((cFreq, idx) => {
                            const cOsc = this.ctx.createOscillator();
                            const cFilter = this.ctx.createBiquadFilter();
                            const cGain = this.ctx.createGain();
                            // 各構成音を左右の3D空間 (-0.85 〜 +0.85) にワイド定位！
                            const panPos = ((idx / (chord.length - 1)) * 2 - 1) * 0.85;
                            const panNode = this.createPanner(panPos);

                            cOsc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
                            cOsc.frequency.setValueAtTime(cFreq, now);
                            cOsc.detune.setValueAtTime((idx - 2) * 7, now);

                            cFilter.type = 'lowpass';
                            cFilter.frequency.setValueAtTime(isDrop ? 2800 : 1800, now);

                            cGain.gain.setValueAtTime(0.001, now);
                            cGain.gain.linearRampToValueAtTime(isDrop ? 0.026 : 0.020, now + 0.06);
                            cGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                            cOsc.connect(cFilter);
                            cFilter.connect(cGain);
                            cGain.connect(panNode);
                            if (this.convolver && idx % 2 === 0) cGain.connect(this.convolver);
                            cOsc.start(now);
                            cOsc.stop(now + dur + 0.03);
                        });
                    }

                    // 5. 3Dバイノーラル・クリスタルハープ/ベル・アルペジオ（左右の耳元をぐるりと回転！）
                    const aFreq = cur.arp[step % 8] * (isDrop && step % 4 === 0 ? 1.5 : 1.0);
                    if (aFreq > 0) {
                        const aOsc = this.ctx.createOscillator();
                        const aGain = this.ctx.createGain();
                        // サイン波で滑らかにL⇔Rを往復する立体音響パンニング
                        const arpPan = this.createPanner(Math.sin(step * 0.45) * 0.88);
                        aOsc.type = 'sine';
                        aOsc.frequency.setValueAtTime(aFreq, now);
                        aGain.gain.setValueAtTime(isDrop ? 0.036 : 0.025, now);
                        aGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                        aOsc.connect(aGain);
                        aGain.connect(arpPan);
                        if (this.delayL) aGain.connect(step % 2 === 0 ? this.delayL : this.delayR);
                        if (this.convolver) aGain.connect(this.convolver);
                        aOsc.start(now);
                        aOsc.stop(now + 0.17);
                    }

                    // 6. エモーショナル・ビブラート・シンセリード（歌うような美しい主旋律＋ホールリバーブ）
                    const leadArray = isDrop ? cur.leadDrop : cur.leadVerse;
                    const lFreq = leadArray[s32];
                    if (lFreq > 0) {
                        const leadPan = this.createPanner(Math.cos(step * 0.2) * 0.32);
                        [-6, 6].forEach((det, i) => {
                            const lOsc = this.ctx.createOscillator();
                            const lFilter = this.ctx.createBiquadFilter();
                            const lGain = this.ctx.createGain();

                            lOsc.type = i === 0 ? 'sawtooth' : 'triangle';
                            lOsc.frequency.setValueAtTime(lFreq, now);
                            lOsc.detune.setValueAtTime(det, now);

                            // ビブラートLFO
                            const vib = this.ctx.createOscillator();
                            const vibGain = this.ctx.createGain();
                            vib.frequency.setValueAtTime(5.5, now);
                            vibGain.gain.setValueAtTime(4.5, now);
                            vib.connect(vibGain);
                            vibGain.connect(lOsc.frequency);
                            vib.start(now);
                            vib.stop(now + 0.28);

                            lFilter.type = 'lowpass';
                            lFilter.frequency.setValueAtTime(3600, now);

                            lGain.gain.setValueAtTime(0.001, now);
                            lGain.gain.linearRampToValueAtTime(isDrop ? 0.034 : 0.026, now + 0.018);
                            lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

                            lOsc.connect(lFilter);
                            lFilter.connect(lGain);
                            lGain.connect(leadPan);
                            if (this.delayL && i === 0) lGain.connect(this.delayL);
                            if (this.convolver && i === 1) lGain.connect(this.convolver);
                            lOsc.start(now);
                            lOsc.stop(now + 0.28);
                        });
                    }
                // 節の頭（最初と後半）に、腹に響く重低音のブーン
                    if (step === 0 || step === 64) {
                        const bo = this.ctx.createOscillator();
                        const bg = this.ctx.createGain();
                        bo.type = 'sine';
                        bo.frequency.setValueAtTime(62, now);
                        bo.frequency.exponentialRampToValueAtTime(26, now + 1.4);
                        bg.gain.setValueAtTime(0.5, now);
                        bg.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
                        bo.connect(bg);
                        bg.connect(dest);
                        bo.start(now);
                        bo.stop(now + 1.65);
                    }
                } catch (e) {}
            }

            // ターゲット照準ロックオン時の未来的なクリスタル・ロックオン音 (3D定位対応)
            playLockOn(panVal = 0) {
                if (!this.sfxOn || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const panNode = this.createPanner(panVal);
                    [1480, 1975.5].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.032);
                        gain.gain.setValueAtTime(0.045, now + i * 0.032);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.032 + 0.065);
                        osc.connect(gain);
                        gain.connect(panNode);
                        osc.start(now + i * 0.032);
                        osc.stop(now + i * 0.032 + 0.07);
                    });
                } catch (e) {}
            }

            // 3Dステレオ定位対応：豪華なSFプラズマ・クリスタルレールガン発射音
            playShot(panVal = 0) {
                if (!this.sfxOn || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const panNode = this.createPanner(panVal);

                    // 1. 高域クリスタル・レーザーチャープ
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(2200, now);
                    osc1.frequency.exponentialRampToValueAtTime(240, now + 0.14);
                    gain1.gain.setValueAtTime(0.14, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc1.connect(gain1);
                    gain1.connect(panNode);
                    if (this.delayL) gain1.connect(this.delayL);
                    osc1.start(now);
                    osc1.stop(now + 0.16);

                    // 2. 重低音プラズマ・キャノンパンチ
                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(320, now);
                    osc2.frequency.exponentialRampToValueAtTime(45, now + 0.11);
                    gain2.gain.setValueAtTime(0.20, now);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc2.connect(gain2);
                    gain2.connect(panNode);
                    osc2.start(now);
                    osc2.stop(now + 0.13);
                } catch (e) {}
            }

            // 3Dステレオ定位対応：正解撃破音（重低音プラズマ爆破＋立体ホール残響付きクリスタル和音アルペジオ）
            playCorrect(combo = 1, panVal = 0) {
                if (!this.sfxOn || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const panNode = this.createPanner(panVal);

                    if (this.noiseBuffer) {
                        const expNoise = this.ctx.createBufferSource();
                        expNoise.buffer = this.noiseBuffer;
                        const expFilter = this.ctx.createBiquadFilter();
                        expFilter.type = 'lowpass';
                        expFilter.frequency.setValueAtTime(1600, now);
                        expFilter.frequency.exponentialRampToValueAtTime(90, now + 0.36);
                        const expGain = this.ctx.createGain();
                        expGain.gain.setValueAtTime(0.20, now);
                        expGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                        expNoise.connect(expFilter);
                        expFilter.connect(expGain);
                        expGain.connect(panNode);
                        expNoise.start(now);
                        expNoise.stop(now + 0.4);
                    }

                    const subOsc = this.ctx.createOscillator();
                    const subGain = this.ctx.createGain();
                    subOsc.type = 'sine';
                    subOsc.frequency.setValueAtTime(160, now);
                    subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.34);
                    subGain.gain.setValueAtTime(0.28, now);
                    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    subOsc.connect(subGain);
                    subGain.connect(panNode);
                    subOsc.start(now);
                    subOsc.stop(now + 0.36);

                    const pitchBoost = Math.min(1.5, 1 + (combo - 1) * 0.05);
                    const notes = [523.25 * pitchBoost, 659.25 * pitchBoost, 783.99 * pitchBoost, 1046.5 * pitchBoost, 1318.5 * pitchBoost, 1567.98 * pitchBoost];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        const notePan = this.createPanner(Math.max(-1, Math.min(1, panVal + (i - 2.5) * 0.18)));
                        osc.type = i % 2 === 0 ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.042);
                        gain.gain.setValueAtTime(0.14, now + i * 0.042);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.042 + 0.35);
                        osc.connect(gain);
                        gain.connect(notePan);
                        if (this.convolver) gain.connect(this.convolver);
                        if (this.delayL && i % 2 === 0) gain.connect(this.delayL);
                        osc.start(now + i * 0.042);
                        osc.stop(now + i * 0.042 + 0.36);
                    });
                } catch (e) {}
            }

            // 3Dステレオ定位対応：誤射ミス音（電磁シールド反射音＋アラート）
            playWrong(panVal = 0) {
                if (!this.sfxOn || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const panNode = this.createPanner(panVal);
                    [185, 130].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + i * 0.11);
                        osc.frequency.linearRampToValueAtTime(freq * 0.78, now + i * 0.11 + 0.16);
                        gain.gain.setValueAtTime(0.16, now + i * 0.11);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.18);
                        osc.connect(gain);
                        gain.connect(panNode);
                        if (this.convolver) gain.connect(this.convolver);
                        osc.start(now + i * 0.11);
                        osc.stop(now + i * 0.11 + 0.19);
                    });
                } catch (e) {}
            }

            // WAVE全滅クリアファンファーレ（立体音響シンフォニック・ファンファーレ）
            playWaveClear() {
                if (!this.sfxOn || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093.0];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        const pNode = this.createPanner(Math.sin(i) * 0.7);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.055);
                        gain.gain.setValueAtTime(0.15, now + i * 0.055);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.48);
                        osc.connect(gain);
                        gain.connect(pNode);
                        if (this.convolver) gain.connect(this.convolver);
                        if (this.delayL) gain.connect(i % 2 === 0 ? this.delayL : this.delayR);
                        osc.start(now + i * 0.055);
                        osc.stop(now + i * 0.055 + 0.50);
                    });
                } catch (e) {}
            }
        }

        const sound = new SoundSystem();

        /**
         * ============================================================================
         * 2.5 Three.js 超高クオリティー 3D WebGL レンダリングエンジン (大幅強化版)
         *     - 3Dレーザー照準ビーム＆3Dヘキサゴン・ロックオンリング
         *     - 二重ボーア電子軌道＋3Dホバージェット＋3D立体衝撃波リング
         *     - ワープスターライン＆背景3D分子結晶ネットワーク
         * ============================================================================
         */
        class ThreeStageRenderer {
            constructor(game) {
                this.game = game;
                this.canvas = document.getElementById('webglCanvas');
                this.enabled = true;
                this.camMode = 'dynamic'; // 'dynamic', 'cockpit', 'standard'
                this.symbolTextures = new Map();
                this.invaderMeshes = new Map();
                this.bulletMeshes = [];
                this.explosionMeshes = [];
                this.shockwaveRings = [];

                this.initThree();
            }

            // 2Dキャンバス座標 (0..960, 0..600) を 3Dワールド座標 (-48..48, 30..-30, 0) へ変換
            to3DX(x) { return (x - this.game.W / 2) * 0.1; }
            to3DY(y) { return (this.game.H / 2 - y) * 0.1; }

            initThree() {
                if (typeof THREE === 'undefined' || !this.canvas) {
                    this.enabled = false;
                    return;
                }

                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x020714, 0.0055);

                this.camera = new THREE.PerspectiveCamera(50, this.game.W / this.game.H, 0.1, 500);
                this.camera.position.set(0, -14, 68);
                this.camera.lookAt(0, 2, 0);

                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    alpha: false,
                    powerPreference: 'high-performance'
                });
                this.renderer.setSize(this.game.W, this.game.H, false);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.28;

                // ライティング（宇宙空間の太陽光＋シアンのリムライト＋ゴールドアクセントライト＋機体ライト）
                const ambient = new THREE.AmbientLight(0x93c5fd, 0.85);
                this.scene.add(ambient);

                const mainLight = new THREE.DirectionalLight(0xffffff, 1.45);
                mainLight.position.set(28, 45, 58);
                this.scene.add(mainLight);

                const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.05);
                rimLight.position.set(-45, -25, 32);
                this.scene.add(rimLight);

                const topGoldLight = new THREE.DirectionalLight(0xfacc15, 0.45);
                topGoldLight.position.set(0, 50, 20);
                this.scene.add(topGoldLight);

                this.shipLight = new THREE.PointLight(0x38bdf8, 2.2, 38);
                this.scene.add(this.shipLight);

                // 1. 3D宇宙星空フィールド（1500個の立体恒星パーティクル）
                const starGeo = new THREE.BufferGeometry();
                const starCount = 1500;
                const posArr = new Float32Array(starCount * 3);
                const colArr = new Float32Array(starCount * 3);
                const palette = [
                    new THREE.Color(0xffffff),
                    new THREE.Color(0x7dd3fc),
                    new THREE.Color(0xfde047),
                    new THREE.Color(0xc4b5fd),
                    new THREE.Color(0x67e8f9)
                ];
                for (let i = 0; i < starCount; i++) {
                    posArr[i * 3]     = (Math.random() - 0.5) * 240;
                    posArr[i * 3 + 1] = (Math.random() - 0.5) * 160;
                    posArr[i * 3 + 2] = -Math.random() * 150 - 6;
                    const c = palette[i % palette.length];
                    colArr[i * 3]     = c.r;
                    colArr[i * 3 + 1] = c.g;
                    colArr[i * 3 + 2] = c.b;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                starGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
                const starMat = new THREE.PointsMaterial({
                    size: 0.82,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.92
                });
                this.starField = new THREE.Points(starGeo, starMat);
                this.scene.add(this.starField);

                // 1.5 宇宙空間に浮かぶ3D結晶ラティス構造体（背景でゆっくり回転する3D分子アート）
                this.bgCrystals = [];
                for (let i = 0; i < 6; i++) {
                    const cGeo = new THREE.IcosahedronGeometry(3.8 + (i % 3) * 1.4, 0);
                    const cMat = new THREE.MeshBasicMaterial({
                        color: i % 2 === 0 ? 0x0ea5e9 : 0x6366f1,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.14
                    });
                    const cMesh = new THREE.Mesh(cGeo, cMat);
                    cMesh.position.set(-48 + i * 19, 14 - (i % 2) * 24, -28 - (i % 3) * 12);
                    this.scene.add(cMesh);
                    this.bgCrystals.push(cMesh);
                }

                // 2. 遠景の3D巨大環付き惑星（立体球体＋大気オーラ＋多重リング＋公転する衛星）
                this.planetGroup = new THREE.Group();
                this.planetGroup.position.set(38, 19, -38);
                const planetGeo = new THREE.SphereGeometry(7.2, 32, 32);
                const planetMat = new THREE.MeshStandardMaterial({
                    color: 0x1d4ed8,
                    emissive: 0x071936,
                    roughness: 0.4,
                    metalness: 0.3
                });
                this.planetMesh = new THREE.Mesh(planetGeo, planetMat);
                this.planetGroup.add(this.planetMesh);

                // 惑星の大気グロー球体
                const atmoGeo = new THREE.SphereGeometry(7.9, 32, 32);
                const atmoMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.16,
                    wireframe: true
                });
                this.planetGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

                const ringGeo = new THREE.RingGeometry(9.2, 15.5, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.38
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI * 0.38;
                ringMesh.rotation.y = -0.25;
                this.planetGroup.add(ringMesh);
                this.scene.add(this.planetGroup);

                // 3. 下部の3Dサイバー防衛グリッドフロア
                this.gridHelper = new THREE.GridHelper(160, 40, 0x38bdf8, 0x0c345a);
                this.gridHelper.position.set(0, -25.5, -18);
                this.gridHelper.material.transparent = true;
                this.gridHelper.material.opacity = 0.45;
                this.scene.add(this.gridHelper);

                // 4. プレイヤーの3D宇宙ロケット戦闘機＋3Dレーザーサイト照準＋3Dロックオンリングを構築
                this.buildPlayerSpaceship();
                this.build3DLaserSightAndReticle();
            }

            build3DLaserSightAndReticle() {
                // 3D空間内で自機からインベーダーまで伸びる立体レーザー照準ビーム
                const sightGeo = new THREE.CylinderGeometry(0.08, 0.14, 1, 8);
                sightGeo.translate(0, 0.5, 0);
                this.sightMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.42
                });
                this.laserSightMesh = new THREE.Mesh(sightGeo, this.sightMat);
                this.scene.add(this.laserSightMesh);

                // 照準が合っている3Dインベーダーの前面に浮かぶ3Dホログラム・ターゲットロックオンリング
                this.lockReticleGroup = new THREE.Group();
                const outerRingGeo = new THREE.RingGeometry(6.2, 6.8, 6);
                const outerRingMat = new THREE.MeshBasicMaterial({
                    color: 0xfde047,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.88
                });
                this.lockOuterRing = new THREE.Mesh(outerRingGeo, outerRingMat);
                this.lockReticleGroup.add(this.lockOuterRing);

                const innerRingGeo = new THREE.RingGeometry(4.6, 4.95, 24);
                const innerRingMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.75
                });
                this.lockInnerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
                this.lockReticleGroup.add(this.lockInnerRing);

                this.lockReticleGroup.visible = false;
                this.scene.add(this.lockReticleGroup);
            }

            /**
             * プレイヤーの3D宇宙ロケット戦闘機メッシュを構築
             */
            buildPlayerSpaceship() {
                this.shipGroup = new THREE.Group();
                this.thrusterCones = [];

                // センター機体（メタリックコーン＆シリンダー）
                const bodyGeo = new THREE.ConeGeometry(2.2, 7.5, 16);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0xe0f2fe,
                    emissive: 0x0369a1,
                    emissiveIntensity: 0.35,
                    metalness: 0.85,
                    roughness: 0.2
                });
                const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
                bodyMesh.position.y = 0.5;
                this.shipGroup.add(bodyMesh);

                // 先端ゴールデン・ノーズコーン
                const noseGeo = new THREE.ConeGeometry(1.15, 2.8, 16);
                const noseMat = new THREE.MeshStandardMaterial({
                    color: 0xfacc15,
                    emissive: 0xd97706,
                    emissiveIntensity: 0.6,
                    metalness: 0.7,
                    roughness: 0.15
                });
                const noseMesh = new THREE.Mesh(noseGeo, noseMat);
                noseMesh.position.y = 3.6;
                this.shipGroup.add(noseMesh);

                // ガラスコックピット・キャノピー
                const canopyGeo = new THREE.SphereGeometry(1.05, 16, 16);
                canopyGeo.scale(0.75, 1.6, 0.7);
                const canopyMat = new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    emissive: 0x0284c7,
                    emissiveIntensity: 0.7,
                    metalness: 0.9,
                    roughness: 0.1
                });
                const canopyMesh = new THREE.Mesh(canopyGeo, canopyMat);
                canopyMesh.position.set(0, 0.6, 1.1);
                this.shipGroup.add(canopyMesh);

                // デルタウイング（左右主翼）
                const wingShape = new THREE.Shape();
                wingShape.moveTo(0, 2.2);
                wingShape.lineTo(-5.2, -2.4);
                wingShape.lineTo(-4.4, -3.2);
                wingShape.lineTo(0, -1.8);
                wingShape.lineTo(4.4, -3.2);
                wingShape.lineTo(5.2, -2.4);
                wingShape.closePath();

                const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.35, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1 });
                const wingMat = new THREE.MeshStandardMaterial({
                    color: 0x0284c7,
                    emissive: 0x075985,
                    metalness: 0.8,
                    roughness: 0.25
                });
                const wingMesh = new THREE.Mesh(wingGeo, wingMat);
                wingMesh.position.set(0, -0.3, -0.2);
                this.shipGroup.add(wingMesh);

                // ツイン・アフターバーナー噴射炎コーン
                const coneGeo = new THREE.ConeGeometry(0.65, 2.8, 12);
                const coneMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.88
                });
                [-1.6, 1.6].forEach(tx => {
                    const cone = new THREE.Mesh(coneGeo, coneMat);
                    cone.rotation.x = Math.PI;
                    cone.position.set(tx, -3.8, 0);
                    this.shipGroup.add(cone);
                    this.thrusterCones.push(cone);
                });

                // 機体周囲を公転する電子ビット（e- オービター）
                this.orbiterGroup = new THREE.Group();
                const bitGeo = new THREE.SphereGeometry(0.5, 12, 12);
                const bitMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
                [-5.5, 5.5].forEach(bx => {
                    const bit = new THREE.Mesh(bitGeo, bitMat);
                    bit.position.set(bx, 0, 0);
                    this.orbiterGroup.add(bit);
                });
                this.shipGroup.add(this.orbiterGroup);

                this.scene.add(this.shipGroup);
            }

            /**
             * 元素記号パネル用の高解像度キャンバステクスチャを生成・キャッシュ
             */
            getSymbolTexture(el) {
                if (this.symbolTextures.has(el.sym)) {
                    return this.symbolTextures.get(el.sym);
                }
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 160;
                const ctx = c.getContext('2d');

                // 背景グラデーション
                const grad = ctx.createLinearGradient(0, 0, 0, c.height);
                grad.addColorStop(0, '#1e3a5f');
                grad.addColorStop(0.55, '#122844');
                grad.addColorStop(1, '#091526');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, c.width, c.height);

                // 外枠ネオンボーダー
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 8;
                ctx.strokeRect(6, 6, c.width - 12, c.height - 12);

                // 左上の炎色インジケータードット
                ctx.fillStyle = el.flame;
                ctx.beginPath();
                ctx.arc(28, 28, 8, 0, Math.PI * 2);
                ctx.fill();

                // 元素記号テキスト
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 84px "Inter", "Noto Sans JP", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.fillText(el.sym, c.width / 2, c.height / 2 + 4);

                const tex = new THREE.CanvasTexture(c);
                this.symbolTextures.set(el.sym, tex);
                return tex;
            }

            /**
             * 3D元素インベーダーポッドメッシュを作成（3Dメタル装甲＋前面発光元素パネル＋二重立体交差する電子軌道リング）
             */
            createInvaderMesh(inv) {
                const group = new THREE.Group();

                // 1. 立体3D装甲ボックス
                const boxGeo = new THREE.BoxGeometry(10.8, 6.4, 3.0);
                const sideMat = new THREE.MeshStandardMaterial({
                    color: 0x1e3a5f,
                    emissive: 0x0a223d,
                    metalness: 0.82,
                    roughness: 0.22
                });
                const frontMat = new THREE.MeshBasicMaterial({
                    map: this.getSymbolTexture(inv.el)
                });

                const materials = [sideMat, sideMat, sideMat, sideMat, frontMat, sideMat];
                const bodyMesh = new THREE.Mesh(boxGeo, materials);
                group.add(bodyMesh);

                // 2. 外周のネオンフレーム枠
                const edgeGeo = new THREE.EdgesGeometry(boxGeo);
                const edgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
                const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
                group.add(edgeLines);

                // 3. 下部の3Dホバースラスター脚＋発光ジェットコーン
                const legGeo = new THREE.CylinderGeometry(0.65, 0.95, 1.1, 12);
                const legMat = new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    emissive: 0x0284c7,
                    metalness: 0.65,
                    roughness: 0.2
                });
                const jetGeo = new THREE.ConeGeometry(0.55, 1.6, 10);
                const jetMat = new THREE.MeshBasicMaterial({
                    color: inv.el.flame,
                    transparent: true,
                    opacity: 0.78
                });
                const jets = [];
                [-3.2, 3.2].forEach(lx => {
                    const leg = new THREE.Mesh(legGeo, legMat);
                    leg.position.set(lx, -3.6, 0);
                    group.add(leg);

                    const jet = new THREE.Mesh(jetGeo, jetMat);
                    jet.rotation.x = Math.PI;
                    jet.position.set(lx, -4.6, 0);
                    group.add(jet);
                    jets.push(jet);
                });

                // 4. 周囲を3D立体交差して回転する二重ボーア電子軌道リング＋発光電子球×2
                const orbitGroup = new THREE.Group();
                const torusGeo = new THREE.TorusGeometry(6.6, 0.11, 12, 48);
                const torusMat1 = new THREE.MeshBasicMaterial({
                    color: inv.el.flame,
                    transparent: true,
                    opacity: 0.45
                });
                const torusMesh1 = new THREE.Mesh(torusGeo, torusMat1);
                torusMesh1.rotation.x = Math.PI * 0.36;
                torusMesh1.rotation.y = 0.25;
                orbitGroup.add(torusMesh1);

                const torusMat2 = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.32
                });
                const torusMesh2 = new THREE.Mesh(torusGeo, torusMat2);
                torusMesh2.rotation.x = -Math.PI * 0.36;
                torusMesh2.rotation.y = -0.25;
                orbitGroup.add(torusMesh2);

                const elecGeo = new THREE.SphereGeometry(0.48, 12, 12);
                const elecMat1 = new THREE.MeshBasicMaterial({ color: inv.el.flame });
                const elecMesh1 = new THREE.Mesh(elecGeo, elecMat1);
                orbitGroup.add(elecMesh1);

                const elecMat2 = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
                const elecMesh2 = new THREE.Mesh(elecGeo, elecMat2);
                orbitGroup.add(elecMesh2);

                group.add(orbitGroup);

                group.userData = {
                    bodyMesh,
                    edgeMat,
                    orbitGroup,
                    elecMesh1,
                    elecMesh2,
                    jets
                };

                this.scene.add(group);
                return group;
            }

            /**
             * 正解撃破時・誤射時の3Dポリゴン破片バースト＋3D立体衝撃波トーラスリング追加
             */
            spawn3DBurst(x2d, y2d, hexColor, count = 22) {
                if (!this.enabled || !this.scene) return;
                const wx = this.to3DX(x2d);
                const wy = this.to3DY(y2d);
                const col = new THREE.Color(hexColor);

                // 3D立体衝撃波トーラスリング
                const ringGeo = new THREE.TorusGeometry(1.2, 0.18, 12, 40);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: col,
                    transparent: true,
                    opacity: 0.95
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.position.set(wx, wy, 0.8);
                ringMesh.rotation.x = 0.25;
                ringMesh.userData = { scaleSpd: 0.42, life: 26, maxLife: 26 };
                this.scene.add(ringMesh);
                this.shockwaveRings.push(ringMesh);

                for (let i = 0; i < count; i++) {
                    const geo = new THREE.OctahedronGeometry(Math.random() * 0.68 + 0.28, 0);
                    const mat = new THREE.MeshStandardMaterial({
                        color: col,
                        emissive: col,
                        emissiveIntensity: 0.8,
                        metalness: 0.85,
                        roughness: 0.15,
                        transparent: true,
                        opacity: 1
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(wx, wy, 0.5);

                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 0.72 + 0.22;
                    mesh.userData = {
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        vz: (Math.random() - 0.3) * 0.65,
                        rx: (Math.random() - 0.5) * 0.28,
                        ry: (Math.random() - 0.5) * 0.28,
                        life: 36,
                        maxLife: 36
                    };
                    this.scene.add(mesh);
                    this.explosionMeshes.push(mesh);
                }
            }

            /**
             * 毎フレームの3Dシーン更新＆レンダリング
             */
            render() {
                if (!this.enabled || !this.renderer) return;
                const g = this.game;

                // 1. カメラアングル制御（ダイナミック追従 / コックピット背後視点 / スタンダード正面視点）
                const shipX = this.to3DX(g.turret.x);
                const shipY = this.to3DY(g.turret.y);

                if (this.camMode === 'dynamic') {
                    this.camera.position.x += (shipX * 0.28 - this.camera.position.x) * 0.08;
                    this.camera.position.y += (-15 + Math.sin(g.tick * 0.02) * 0.8 - this.camera.position.y) * 0.08;
                    this.camera.position.z += (66 - this.camera.position.z) * 0.08;
                    this.camera.lookAt(shipX * 0.12, 2.5, 0);
                } else if (this.camMode === 'cockpit') {
                    this.camera.position.x += (shipX * 0.62 - this.camera.position.x) * 0.1;
                    this.camera.position.y += (-26 - this.camera.position.y) * 0.1;
                    this.camera.position.z += (54 - this.camera.position.z) * 0.1;
                    this.camera.lookAt(shipX * 0.25, 6.5, 0);
                } else {
                    this.camera.position.x += (0 - this.camera.position.x) * 0.1;
                    this.camera.position.y += (-2 - this.camera.position.y) * 0.1;
                    this.camera.position.z += (72 - this.camera.position.z) * 0.1;
                    this.camera.lookAt(0, -1, 0);
                }

                // 画面シェイク反映
                if (g.screenShake > 0.5) {
                    this.camera.position.x += (Math.random() - 0.5) * g.screenShake * 0.08;
                    this.camera.position.y += (Math.random() - 0.5) * g.screenShake * 0.08;
                }

                // 2. 背景の3D惑星＆結晶フィールド＆星空＆グリッドのアニメーション
                if (this.planetMesh) {
                    this.planetMesh.rotation.y += 0.004;
                    this.planetGroup.rotation.z = Math.sin(g.tick * 0.005) * 0.05;
                }
                if (this.bgCrystals) {
                    this.bgCrystals.forEach((c, idx) => {
                        c.rotation.x += 0.004 * (idx % 2 === 0 ? 1 : -1);
                        c.rotation.y += 0.006;
                    });
                }
                if (this.starField) {
                    this.starField.rotation.z = Math.sin(g.tick * 0.002) * 0.03;
                }
                if (this.gridHelper) {
                    this.gridHelper.position.z = -18 + ((g.tick * 0.18) % 4.0);
                }

                // 3. 3D宇宙戦闘機ロケットの位置・ロール角・ジェット噴射更新
                if (this.shipGroup) {
                    this.shipGroup.position.set(shipX, shipY - g.turret.recoil * 0.1, 1.2);
                    this.shipGroup.rotation.z = -g.turret.bankAngle * 1.1;
                    this.shipGroup.rotation.y = g.turret.bankAngle * 1.85;
                    this.shipGroup.rotation.x = 0.18;

                    if (this.orbiterGroup) {
                        this.orbiterGroup.rotation.y = g.tick * 0.09;
                        this.orbiterGroup.rotation.z = Math.sin(g.tick * 0.05) * 0.35;
                    }
                    this.thrusterCones.forEach((cone, idx) => {
                        const s = 0.85 + Math.sin(g.tick * 0.6 + idx) * 0.28;
                        cone.scale.set(1, s, 1);
                    });
